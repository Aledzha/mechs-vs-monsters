    // чистильщики: сколько куплено, встают на случайные открытые дорожки, по одному на дорожку
    if (m.sweepers) {
      const own = this.sandbox ? m.lanes.length : clamp(Save.data.sweepersOwned || SWEEPERS.start, 0, SWEEPERS.max);   // на Полигоне — на всех дорожках
      const lanes = m.lanes.slice(); for (let i = lanes.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [lanes[i], lanes[j]] = [lanes[j], lanes[i]]; }
      lanes.slice(0, own).forEach(l => { this.sweepers[l] = { state: 'ready', x: LAYOUT.sweepPark, sprite: this.sweeperSprite(l, LAYOUT.sweepPark) }; });
    }
    this.trap = null; this.trapUsed = false;   // Шоковую ловушку игрок ставит сам во время боя (pickTrap/placeTrap)
    this.fx = this.add.graphics().setDepth(1050);
    this.buildHud();
    if (this.sandbox) this.buildSandbox();
    this.bindInput();

    Sound.playMusic(this.blackout ? 'blackout' : 'surface', true);
    if (this.bonus != null) { const d = Save.data; d.bonusNext = d.bonusNext || {}; d.bonusNext[this.m.id] = Date.now() + BONUS_COOLDOWN_MIN * 60000; Save.save(); }
    const intro = [];
    if (!this.endless && !this.sandbox && this.bonus == null && !Save.data.cleared[this.idx] && m.unlock && m.unlock.length) intro.push(t('newMech', { m: m.unlock.map(id => N(MECHS[id].name)).join(', ') }));
    if (this.endless) intro.push(t('endlessHint'));
    if (this.sandbox) intro.push(t('sandboxHint'));
    if (this.bonus != null) intro.push(bonusDesc(m));
    (m.hints || []).forEach(h => intro.push(t(h)));
    intro.forEach((h, i) => this.time.delayedCall(500 + i * 5000, () => this.banner(h, 4500)));
    Sdk.gameplay(true);
    const ranks = this.deck.map(id => Save.rank(id));
    Analytics.track('mission_start', { missionId: this.endless ? 'endless' : this.idx + 1, deck: this.deck.join(','), rankAvg: ranks.length ? ranks.reduce((a, b) => a + b, 0) / ranks.length : 1, attempt: this.attempt });
  }

  // Sweeper стоит на краю поля в начале своей дорожки, с тенью — чтобы не висел на стене базы
  sweeperSprite(l, x) {
    const y = laneFeet(l) + 2, c = this.add.container(x, y).setDepth(laneFeet(l) - 1);
    c.add(this.add.ellipse(0, -2, 76, 14, 0x000000, 0.35));
    c.add(this.add.image(0, 0, 'sweeper').setOrigin(0.5, 0.95).setScale(0.78));
    return c;
  }
  // ------------------------------------------------------------ поле
  drawField() {
    const m = this.m;
    // фон зоны: новая версия (_v2 — нарисована ровно по сетке, с входами базы и проходами монстров), иначе прежний.
    // Откат на старый фон: удалить assets/game/ui/bg_<зона>_v2.jpg
    // растянутое поле (_v3): дорожки на весь экран; на Полигоне — обычное (снизу его панель)
    const v3 = this.blackout ? 'bg_blackout_v3' : 'bg_surface_v3', stretch = LAYOUT.stretched;
    const v2 = stretch ? v3 : this.blackout ? 'bg_blackout_v2' : 'bg_surface_v2';
    this.bgV2 = this.textures.exists(v2);
    const custom = this.blackout && (this.bgV2 || this.textures.exists('bg_blackout'));
    setFieldGrid(!this.blackout);            // клетки по плиткам фона: у Поверхности (все версии) плитки со сдвигом, у Литейного — ровные
    const bg = this.add.image(W / 2, H / 2, this.bgV2 ? v2 : custom ? 'bg_blackout' : 'bg_surface').setDisplaySize(W, H).setDepth(-10);
    if (this.blackout && !custom) {
      bg.setTint(0x5a6494);
      this.add.rectangle(W / 2, H / 2, W, H, 0x140a24, 0.38).setDepth(-9);
      [300, 820, 1340].forEach((x, i) => {
        const glow = this.add.circle(x, 150, 90, 0xff3b1f, 0.18).setDepth(-8);
        this.tweens.add({ targets: glow, alpha: 0.04, duration: 900 + i * 150, yoyo: true, repeat: -1 });
      });
    }
    for (let l = 0; l < NL; l++) if (!m.lanes.includes(l)) this.closedLane(l); else this.laneArrows(l);
    this.baseWall();
    this.fgOverlay();
  }
  // Стена базы: поверх фона кладётся отдельная картинка base_wall (если есть) — старый фон не трогаем.
  // Удалите assets/game/ui/base_wall.png, чтобы вернуть прежний вид.
  baseWall() {
    if (this.bgV2 || !this.textures.exists('base_wall')) return;   // у новых фонов своя база с входами
    const img = this.add.image(0, H, 'base_wall').setOrigin(0, 1).setDepth(-9.5);
    img.setScale(Math.min((H - 140) / img.height, (FIELD_LEFT - 4) / img.width));
    if (this.blackout) img.setTint(0x8a90b8);
  }
  // Куда уходит прорвавшийся монстр (стена базы на его дорожке)
  gatePos(l) { return { px: 96, py: laneFeet(l) - 40 }; }
  // Лёгкая подсказка на открытой дорожке: у выхода монстров бегут стрелки в сторону базы
  laneArrows(l) {
    const cy = laneY(l) + 4;
    for (let i = 0; i < 3; i++) {
      const ch = this.add.graphics().setDepth(3);
      ch.lineStyle(7, 0x3a1206, 0.5); ch.beginPath(); ch.moveTo(10, -13); ch.lineTo(-3, 0); ch.lineTo(10, 13); ch.strokePath();
      ch.lineStyle(4, 0xff8a3a, 1); ch.beginPath(); ch.moveTo(10, -13); ch.lineTo(-3, 0); ch.lineTo(10, 13); ch.strokePath();
      ch.setPosition(LAYOUT.fieldRight - 20, cy).setAlpha(0);
      this.tweens.add({ targets: ch, x: LAYOUT.fieldRight - 130, duration: 1500, delay: i * 500, repeat: -1,
        onUpdate: () => ch.setAlpha(Math.sin((LAYOUT.fieldRight - 20 - ch.x) / 110 * Math.PI) * 0.55) });
    }
  }
  // Камни, столбики и кусты фона, заходящие на дорожки (координаты поля). Дымка и пунктир закрытой
  // дорожки вырезаются по этим контурам маской, чтобы передний план фона оставался поверх.
  fgHoles() {
    if (this.blackout || this.bgV2) return [];   // у новых фонов крупных камней на дорожках нет
    return [
      [[186, 790], [193, 755], [202, 724], [211, 717], [234, 713], [268, 721], [276, 728], [288, 762], [296, 790]],
      [[1458, 790], [1458, 730], [1470, 726], [1495, 726], [1497, 790]],
      [[1474, 790], [1488, 736], [1497, 724], [1532, 718], [1561, 721], [1573, 732], [1572, 790]],
    ];
  }
  // Камни фона ближе к зрителю, чем юниты нижней дорожки: кладём поверх юнитов копию фона, вырезанную по их контурам,
  // — мех в первой клетке стоит за камнем, а не на нём.
  fgOverlay() {
    const holes = this.fgHoles(); if (!holes.length) return;
    const mg = this.make.graphics({ add: false }); mg.fillStyle(0xffffff, 1);
    holes.forEach(p => mg.fillPoints(p.map(([x, y]) => ({ x, y })), true));
    this.add.image(W / 2, H / 2, 'bg_surface').setDisplaySize(W, H).setDepth(790).setMask(mg.createGeometryMask());
  }
  // Закрытая дорожка: голографическое оцепление — холодная дымка, пунктирный контур с уголками,
  // всплывающие голо-шестигранники и замок в шестигранной плашке
  closedLane(l) {
    const L = LAYOUT.lanes[l], x0 = FIELD_LEFT + 2, x1 = LAYOUT.fieldRight - 10, y0 = L.top - 2, y1 = L.bot + 1;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, h = y1 - y0, CY = 0x5fd6ff;
    const fog = this.add.rectangle(cx, cy, x1 - x0, h, 0x0c1c2c, 0.46).setDepth(-5);
    // голо-шестигранники: всплывают из травы и тают
    this.time.addEvent({ delay: 420 + l * 37, loop: true, callback: () => {
      const hx = rand(x0 + 130, x1 - 160), hy = rand(cy - 4, y1 - 10), r = rand(5, 10), pts = [];
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r }); }
      const hg = this.add.graphics({ x: hx, y: hy }).setDepth(-4).setBlendMode(Phaser.BlendModes.ADD);
      hg.lineStyle(2, 0x9ff0ff, 1); hg.strokePoints(pts, true); hg.setAlpha(0);
      this.tweens.add({ targets: hg, y: hy - rand(22, 38), angle: rand(-60, 60), duration: 1800, onUpdate: tw => hg.setAlpha(Math.sin(tw.progress * Math.PI) * 0.6), onComplete: () => hg.destroy() });
    } });
    const g = this.add.graphics().setDepth(4);
    // пунктирный контур
    g.lineStyle(3, CY, 0.75);
    for (const y of [y0, y1]) for (let x = x0 + 26; x < x1 - 140; x += 30) g.lineBetween(x, y, x + 16, y);
    // уголки-скобы
    g.lineStyle(4, CY, 0.9);
    const k = 18;
    [[x0, y0, 1, 1], [x0, y1, 1, -1]].forEach(([x, y, sx, sy]) => { g.lineBetween(x, y, x + k * sx, y); g.lineBetween(x, y, x, y + k * sy); });
    const holes = this.fgHoles().filter(p => p.some(q => q[1] >= y0 - 4 && q[1] <= y1 + 4));
    if (holes.length) {
      const mg = this.make.graphics({ add: false }); mg.fillStyle(0xffffff, 1);
      holes.forEach(p => mg.fillPoints(p.map(([x, y]) => ({ x, y })), true));
      const mask = mg.createGeometryMask(); mask.setInvertAlpha(true);
      fog.setMask(mask); g.setMask(mask);
    }
    // замок в шестигранной плашке (отдельный слой — маска его не режет)
    const lg = this.add.graphics().setDepth(4.6);
    const lx = x1 - 110, R = 21, hex = [];
    for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; hex.push({ x: lx + Math.cos(a) * R, y: cy + Math.sin(a) * R }); }
    lg.fillStyle(0x0b1020, 0.8); lg.fillPoints(hex, true); lg.lineStyle(2, CY, 0.9); lg.strokePoints(hex, true);
    drawLockIcon(lg, lx, cy - 1, 0.72);
  }
  makeNests(n) {
    const perLane = {}; let tries = 0;
    while (Object.keys(this.nests).length < n && tries++ < 200) {
      const l = pick(this.m.lanes), c = randi(NEST_MIN_COL, COLS - 1), k = l + ',' + c;   // не ближе 5-й клетки от базы
      if (this.nests[k] || (perLane[l] || 0) >= 3) continue;
      perLane[l] = (perLane[l] || 0) + 1;
      const L = LAYOUT.lanes[l], e = L.edges, sp = this.add.image(colX(c, l), L.mid + 2, 'nest').setDepth(5 + l);
      const sc = Math.min((e[c + 1] - e[c]) * 0.78 / sp.width, (L.bot - L.top) * 1.05 / sp.height);
      sp.setScale(sc, sc * 0.9);
      this.nests[k] = { l, c, sprite: sp };
    }
  }

  // ------------------------------------------------------------ HUD
  buildHud() {
    const D = 2000, m = this.m, top = HUD.top, h = HUD.h;
    // затемнение сверху уходит в прозрачность — поле под HUD остаётся видно
    this.add.image(W / 2, 0, 'hud_grad').setOrigin(0.5, 0).setDisplaySize(W, LAYOUT.hudH + 36).setDepth(D);
    const g = this.add.graphics().setDepth(D);
    // энергия
    hudPanel(g, 10, top, 148, h, { stroke: 0xc99a1c });
    if (!this.assembly) {
      this.add.image(HUD.orbX, HUD.y, 'orb').setDepth(D);
      this.energyTx = this.add.text(HUD.energyX + 26, HUD.y + 1, '', TXT(40, '#ffe27a', true, { stroke: '#0b1020', strokeThickness: 5 })).setOrigin(0.5).setDepth(D);
      // лоток карточек: шаг ужимается, если слотов много
      // Шоковая ловушка: есть в запасе и открыта — отдельная карточка в конце лотка (одна за уровень)
      this.trapCard = !this.endless && !this.sandbox && !!Save.data.cleared[WORKSHOP.trapAfter - 1] && Save.data.traps > 0;
      const n = Math.max(1, this.deck.length + (this.trapCard ? 1 : 0));
      const step = Math.min(HUD.cardStep, Math.floor((HUD.trayX1 - HUD.trayX0 - 16) / n)), size = Math.min(HUD.card, step - 10);
      hudPanel(g, HUD.trayX0, top, (n - 1) * step + size + 20, h, { fill: 0x101a2e });
      this.cards = this.deck.map((id, i) => {
        const x = HUD.trayX0 + 10 + size / 2 + i * step;
        const c = mechCard(this, x, HUD.y, id, size).setDepth(D);
        const shade = this.add.graphics();
        const cdTx = this.add.text(0, -size * 0.12, '', TXT(Math.round(size * 0.34), '#ffffff', true, { stroke: '#0b1020', strokeThickness: 6 })).setOrigin(0.5);
        const key = this.add.circle(size / 2 - 11, -size / 2 + 11, 11, 0x0b1020, 0.85).setStrokeStyle(2, 0x4f79b8);
        const keyTx = this.add.text(size / 2 - 11, -size / 2 + 11, String(i + 1), TXT(14, '#aebbd4')).setOrigin(0.5);
        c.add([shade, cdTx, key, keyTx]);
        c.bg.setInteractive({ useHandCursor: true }).on('pointerdown', () => { if (!this.paused && !this.ended) this.pickCard(id); });
        return { id, c, shade, cdTx, size, frac: -1 };
      });
      if (this.trapCard) {
        const x = HUD.trayX0 + 10 + size / 2 + this.deck.length * step, s = size, h2 = s / 2;
        const c = this.add.container(x, HUD.y).setDepth(D), cg = this.add.graphics();
        const hit = this.add.rectangle(0, 0, s, s, 0, 0.001);
        const img = fitImage(this.add.image(0, -s * 0.1, 'trap'), s * 0.84, s * 0.5);
        const cnt = this.add.text(0, h2 - s * 0.16, '×' + Save.data.traps, TXT(Math.round(s * 0.2), '#7ff3ff', true, { stroke: '#0b1020', strokeThickness: 4 })).setOrigin(0.5);
        c.add([cg, hit, img, cnt]);
        c.setFrame = col => {
          if (c.frame === col) return c; c.frame = col; cg.clear();
          cg.fillStyle(0x000000, 0.4); cg.fillRoundedRect(-h2 + 2, -h2 + 4, s, s, 12);
          cg.fillStyle(0x0f2230); cg.fillRoundedRect(-h2, -h2, s, s, 12);
          cg.fillStyle(0x7ff3ff, 0.12); cg.fillRoundedRect(-h2 + 4, -h2 + 4, s - 8, s * 0.62, 9);
          if (col === HUD_FRAME.sel) { cg.lineStyle(8, col, 0.3); cg.strokeRoundedRect(-h2 - 3, -h2 - 3, s + 6, s + 6, 15); }
          cg.lineStyle(3, col); cg.strokeRoundedRect(-h2, -h2, s, s, 12); return c;
        };
        c.setFrame(0x7ff3ff);
        hit.setInteractive({ useHandCursor: true }).on('pointerdown', () => { if (!this.paused && !this.ended) this.pickTrap(); });
        this.trapUI = { c, img, cnt };
      }
    } else {
      this.add.text(HUD.energyX, HUD.y, t('assembly'), TXT(20, '#ffe27a', true, { align: 'center', wordWrap: { width: 132 } })).setOrigin(0.5).setDepth(D);
      hudPanel(g, HUD.trayX0, top, HUD.trayX1 - HUD.trayX0, h, { fill: 0x101a2e });
      g.fillStyle(0x0b1020, 0.9); g.fillRoundedRect(HUD.trayX0 + 12, top + h - 18, HUD.trayX1 - HUD.trayX0 - 24, 10, 5);
      g.lineStyle(2, 0x3b5b8c); for (let x = HUD.trayX0 + 30; x < HUD.trayX1 - 20; x += 28) g.lineBetween(x, top + h - 16, x - 8, top + h - 10);
      this.belt = []; this.beltT = 1; this.beltN = 0;
    }
    // убрать меха
    this.recycleBtn = hudButton(this, HUD.recycleX, HUD.y, 96, h, t('recycle'), 0x4a3b24, () => { if (!this.paused && !this.ended) this.toggleRecycle(); }, 19, drawRecycleIcon).setDepth(D);
    // волны и награда
    const wx = HUD.waveX - HUD.waveW / 2;
    hudPanel(g, wx, top, HUD.waveW, h);
    this.waveTx = this.add.text(HUD.waveX, top + 24, '', TXT(22, '#ffffff')).setOrigin(0.5).setDepth(D);
    this.waveG = this.add.graphics().setDepth(D); this.waveFrac = -1;
    this.waveBarBox = { x: wx + 16, y: top + 44, w: HUD.waveW - 32, h: 18 };
    this.add.image(HUD.creditX, HUD.creditY, 'ic_credit').setScale(0.6).setDepth(D);
    this.creditTx = this.add.text(HUD.creditX + 18, HUD.creditY, '+0', TXT(20, '#ffe27a')).setOrigin(0, 0.5).setDepth(D);
    // пауза и скорость
    hudButton(this, HUD.ctrlX, top + 25, 76, 50, '', 0x2b4a7a, () => { if (!this.ended) this.setPaused(!this.paused); }, 22, drawPauseIcon).setDepth(D);
    this.speedBtn = hudButton(this, HUD.ctrlX, top + h - 25, 76, 50, '1x', 0x2b4a7a, () => {
      this.speed = this.speed === 1 ? 2 : 1; this.speedBtn.tx.setText(this.speed + 'x').setColor(this.speed > 1 ? '#ffe27a' : '#ffffff');
      this.speedBtn.setFrame(this.speed > 1 ? HUD_FRAME.sel : null);
    }, 24).setDepth(D);
    this.bannerTx = this.add.text(W / 2 + 60, LAYOUT.hudH + 16, '', TXT(28, '#ffffff', true, { backgroundColor: '#101a2ee6', padding: { x: 22, y: 10 }, align: 'center', wordWrap: { width: 1100 } }))
      .setOrigin(0.5, 0).setDepth(D + 1).setAlpha(0);
  }
  drawWaveBar(frac) {
    const b = this.waveBarBox, g = this.waveG, m = this.m;
    g.clear();
    g.fillStyle(0x0b1020); g.fillRoundedRect(b.x, b.y, b.w, b.h, b.h / 2);
    const fw = Math.round(b.w * clamp(frac, 0, 1));
    if (fw >= b.h) { g.fillStyle(0x4caf50); g.fillRoundedRect(b.x, b.y, fw, b.h, b.h / 2); g.fillStyle(0xffffff, 0.22); g.fillRoundedRect(b.x + 3, b.y + 2, fw - 6, b.h * 0.35, b.h * 0.17); }
    else if (fw > 0) { g.fillStyle(0x4caf50); g.fillCircle(b.x + b.h / 2, b.y + b.h / 2, b.h / 2 * Math.max(0.4, fw / b.h)); }
    g.lineStyle(2, 0x3b5b8c); g.strokeRoundedRect(b.x, b.y, b.w, b.h, b.h / 2);
    // флажки больших волн
    if (!this.endless) for (let n = 1; n <= m.waves; n++) if (this.isHugeWave(n)) {
      const x = b.x + b.w * n / m.waves - (n === m.waves ? 6 : 0), done = this.wave >= n;
      g.fillStyle(0x0b1020); g.fillRect(x - 1, b.y - 8, 3, b.h + 8);
      g.fillStyle(done ? 0x8a93a6 : 0xff5a4a); g.fillTriangle(x + 2, b.y - 8, x + 14, b.y - 4, x + 2, b.y);
    }
  }
  banner(text, dur = 2500) {
    this.bannerTx.setText(text).setAlpha(1);
    this.tweens.killTweensOf(this.bannerTx);
    this.tweens.add({ targets: this.bannerTx, alpha: 0, delay: dur, duration: 400 });
  }

  // ------------------------------------------------------------ ввод
  bindInput() {
    this.input.on('pointerdown', (p, over) => { if (this.paused || this.ended || over.length) return; this.fieldTap(p.x, p.y); });
    this.input.on('pointermove', p => { this.hover = cellAt(p.x, p.y); });
    if (this.input.keyboard) this.input.keyboard.on('keydown', e => {
      if (!e.key || e.key.length > 1 && e.key !== 'Escape' && e.key !== ' ') return;
      if (e.key === ' ' || e.key === 'Escape') { if (!this.ended) this.setPaused(!this.paused); return; }
      if (this.paused || this.ended) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && !this.assembly && n <= this.deck.length) this.pickCard(this.deck[n - 1]);
      if (n >= 1 && this.assembly && this.belt[n - 1]) this.pickBelt(this.belt[n - 1]);
      if ('rRкК'.includes(e.key)) this.toggleRecycle();
      if (DEV && 'gGпП'.includes(e.key)) this.showGrid = !this.showGrid;   // отладочная сетка — только в разработке
    });
    const onHidden = () => { if (!this.ended && !this.paused) this.setPaused(true); };
    const onAdOpen = () => { this.adPaused = true; };
    const onAdClose = () => { this.adPaused = false; };
    this.game.events.on('hidden', onHidden); Bus.on('sdkPause', onHidden); Bus.on('adOpen', onAdOpen); Bus.on('adClose', onAdClose);
    this.events.once('shutdown', () => {
      this.input.removeAllListeners('pointerdown'); this.input.removeAllListeners('pointermove');
      if (this.input.keyboard) this.input.keyboard.removeAllListeners('keydown');
      this.game.events.off('hidden', onHidden); Bus.off('sdkPause', onHidden); Bus.off('adOpen', onAdOpen); Bus.off('adClose', onAdClose);
      Sound.setHuge(false); Sound.setPaused(false); this.anims.resumeAll();
    });
  }
  pickCard(id) {
    this.recycle = false;
    const d = MECHS[id];
    if (this.cardCd[id] > 0) { Sound.play('error'); return; }
    if (this.energy < d.cost) { Sound.play('error'); this.banner(t('noEnergy'), 900); return; }
    this.sel = this.sel && this.sel.id === id ? null : { id };
    Sound.play('click');
  }
  pickTrap() {
    this.recycle = false;
    if (this.trapUsed) { Sound.play('error'); this.banner(t('trapOnce'), 1200); return; }

  step(dt) {

    for (const k in this.craters) { const c = this.craters[k]; c.t -= dt; if (c.t <= 0) { c.sprite.destroy(); delete this.craters[k]; } else c.sprite.setAlpha(Math.min(1, c.t / 10)); }

        this.ambientN++; this.ambientT = Math.min(9.5, 6 + this.ambientN * 0.4);

    this.updateBolts(dt);

    this.bolts = this.bolts.filter(x => !x.dead);
    this.orbs = this.orbs.filter(x => !x.done);
    this.coins = this.coins.filter(x => !x.done);
    this.beams = this.beams.filter(b => b.t > 0);

    const x0 = me.x + me.muzzle.x - 14, y0 = me.y + me.muzzle.y, x1 = x0 + (tx - x0) * ext, y1 = y0 + (ty - y0) * ext;
    const len = Math.hypot(x1 - x0, y1 - y0); if (len < 4) return;
    if (this.textures.exists('crusher_link') && this.textures.exists('crusher_claw_open')) {
      // нарисованная рука: звенья по дуге над преградой + клешня (раскрыта / сомкнута) по касательной на конце
      const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - Math.min(120, len * 0.45), B = u => { const v = 1 - u; return { x: v * v * x0 + 2 * v * u * cx + u * u * x1, y: v * v * y0 + 2 * v * u * cy + u * u * y1 }; };
      const pts = []; let L = 0, prev = B(0); pts.push({ p: prev, L: 0 });
      for (let i = 1; i <= 40; i++) { const p = B(i / 40); L += Math.hypot(p.x - prev.x, p.y - prev.y); pts.push({ p, L }); prev = p; }
      const at = d => { for (let i = 1; i < pts.length; i++) if (pts[i].L >= d) { const a = pts[i - 1], b = pts[i], k = (d - a.L) / Math.max(0.001, b.L - a.L); return { x: a.p.x + (b.p.x - a.p.x) * k, y: a.p.y + (b.p.y - a.p.y) * k, ang: Math.atan2(b.p.y - a.p.y, b.p.x - a.p.x) }; } const a = pts[pts.length - 2].p, b = pts[pts.length - 1].p; return { x: b.x, y: b.y, ang: Math.atan2(b.y - a.y, b.x - a.x) }; };
      const S = 1.15, step = 64 * S * 0.8;
      for (let d = step / 2; d < L - 34; d += step) { const q = at(d); this.armSprite('crusher_link').setOrigin(0.5).setPosition(q.x, q.y).setRotation(q.ang).setScale(S); }
      const e = at(L); this.armSprite(closed ? 'crusher_claw_closed' : 'crusher_claw_open').setPosition(e.x, e.y).setRotation(e.ang).setScale(1.2).setOrigin(0.22, 0.5);
      return;
    }
    // дуга: чем дальше тянется, тем выше перекидывается через соседа
    const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - Math.min(120, len * 0.45);
    const P = []; for (let i = 0; i <= 18; i++) { const u = i / 18, v = 1 - u; P.push({ x: v * v * x0 + 2 * v * u * cx + u * u * x1, y: v * v * y0 + 2 * v * u * cy + u * u * y1 }); }
    const path = (w, col) => { g.lineStyle(w, col, 1); g.beginPath(); g.moveTo(P[0].x, P[0].y); for (const p of P) g.lineTo(p.x, p.y); g.strokePath(); };
    path(18, 0x14171f); path(11, 0x8a93a6); path(3, 0xcfd6e4);
    // полосы через равные промежутки по дуге
    let acc = 0;
    for (let i = 1; i < P.length; i++) {
      const dx = P[i].x - P[i - 1].x, dy = P[i].y - P[i - 1].y, l = Math.hypot(dx, dy); acc += l;
      if (i % 2 === 0 && i < P.length - 2) { g.lineStyle(11, 0xffc629, 1); g.lineBetween(P[i].x, P[i].y, P[i].x + dx / l * 7, P[i].y + dy / l * 7); }
    }
    // сустав у корпуса
    g.fillStyle(0x14171f, 1); g.fillCircle(x0, y0, 12); g.fillStyle(0xe8742a, 1); g.fillCircle(x0, y0, 8);
    // клешня по касательной в конце дуги
    const ex = P[18].x - P[16].x, ey = P[18].y - P[16].y, el = Math.hypot(ex, ey) || 1, ux = ex / el, uy = ey / el, nx = -uy, ny = ux;
    const open = closed ? 0.12 : 0.8;
    for (const sgn of [1, -1]) {
      const ax = x1 + nx * sgn * 7, ay = y1 + ny * sgn * 7;
      const dx = Math.cos(open * sgn) * ux - Math.sin(open * sgn) * uy, dy = Math.sin(open * sgn) * ux + Math.cos(open * sgn) * uy;
      const bx = ax + dx * 34, by = ay + dy * 34, tx2 = bx - ux * 13 - nx * sgn * 10, ty2 = by - uy * 13 - ny * sgn * 10;
      g.lineStyle(14, 0x14171f, 1); g.lineBetween(ax, ay, bx, by); g.lineBetween(bx, by, tx2, ty2);
      g.lineStyle(8, 0xe8742a, 1); g.lineBetween(ax, ay, bx, by); g.lineBetween(bx, by, tx2, ty2);
      g.lineStyle(2, 0xffc08a, 1); g.lineBetween(ax, ay, bx, by);
    }
    g.fillStyle(0x14171f, 1); g.fillCircle(x1, y1, 12); g.fillStyle(0x59627a, 1); g.fillCircle(x1, y1, 7);
  }
  // звук поражения — один раз за бой, даже если прорвутся ещё монстры
  playLoseSfx() { if (!this.loseSfx) { this.loseSfx = true; Sound.play('lose'); } }
  lose(mo) {
    if (this.ended) return;
    if (this.sandbox) { this.killMonster(mo, true); return; }   // на Полигоне не проигрывают
    if (this.bonus != null) return this.bonusOver(false);
    this.endBattle(); this.cheer = true;
    this.playLoseSfx();
    this.cameras.main.shake(300, 0.008);
    if (this.endless) return this.endlessOver();
    Analytics.track('mission_defeat', { missionId: this.idx + 1, wave: this.wave, lane: mo.l + 1, monsterId: mo.id });
    Analytics.track('mission_end', { missionId: this.idx + 1, result: 'defeat', duration: Math.round(this.t), wave: this.wave, attempt: this.attempt });
    Analytics.flush();
    const btns = [];
    if (!this.revived) btns.push([t('revive'), 0x3b8c5a, async () => {
      const ok = await Sdk.showRewarded();
      Analytics.track('ad_rewarded', { placement: 'revive', result: ok ? 'completed' : 'failed' }); Analytics.flush();
      if (!ok) { this.banner(t('adFail'), 1500); return; }
      this.revived = true; this.breaching = false; this.cheer = false;
      const sw = { state: 'run', x: 0, sprite: this.sweeperSprite(mo.l, 0) };
      if (this.sweepers[mo.l]) this.sweepers[mo.l].sprite.destroy();
      this.sweepers[mo.l] = sw; this.sweepersUsed++;
      Sound.play('sweeper');
      if (this.ov) { this.ov.destroy(); this.ov = null; }
      this.ended = false; Sdk.gameplay(true); Sound.playMusic(this.blackout ? 'blackout' : 'surface', true); Sound.setHuge(this.hugeNow);
    }, 'ic_ad']);
    btns.push([t('retry'), 0x3b5b8c, () => this.leave(() => this.restart(this.attempt + 1), true), 'ic_retry'], [t('map'), 0x3a3f4b, () => this.leave(() => this.scene.start('Map')), 'ic_map']);
    this.overlay(t('defeat'), [
      [t('defeatInfo', { w: this.wave, t: this.m.waves, l: mo.l + 1, m: N(mo.d.name) }), 26],
      [`${t('counter')}: ${N(mo.d.hint)}`, 24, '#ffe27a'],
    ], btns);
  }
  // ------------------------------------------------------------ Испытания
  bonusOver(won) {
    this.endBattle(); if (won) Sound.play('win'); else { this.cheer = true; this.playLoseSfx(); }
    const m = this.m, d = Save.data;
    // лом за монстров и разломы — с общим множителем Испытаний, за победу — фиксированно (winScrap)
    const parts = Math.round((this.runScrap + this.nestsCleared * 10) * (m.scrapMul || 1) * ECON.bonus) + (won ? m.winScrap || 0 : 0);
    this.runCredits = Math.round(this.runCredits * ECON.bonus * ECON.credits);
    d.scrap += parts; d.credits += this.runCredits;
    d.bonusBest = d.bonusBest || {}; const best = Math.max(d.bonusBest[m.id] || 0, parts); d.bonusBest[m.id] = best; Save.save();
    Analytics.track('bonus_end', { id: m.id, won, parts, wave: this.wave }); Analytics.flush();
    this.overlay(t(won ? 'bonusDone' : 'bonusOver'), [
      [N(m.name), 30, '#ffffff'],
      [`${t('wave', { n: this.wave, m: m.waves })}    ${t('kills')}: ${this.kills || 0}`, 26],
      [`${t('partsEarned')} +${parts}` + (this.runCredits ? `    ${t('credits')} +${this.runCredits}` : ''), 36, '#ffe27a'],
      [`${t('bestResult')}: ${best}`, 22, '#aebbd4'],
      [t('bonusCdNote', { n: BONUS_COOLDOWN_MIN }), 20, '#aebbd4'],
    ], [[t('back'), 0x3a3f4b, () => this.leave(() => this.scene.start('Bonus')), 'ic_map']]);   // повтора нет: Испытание раз в 30 минут
  }

  // ------------------------------------------------------------ Полигон
  buildSandbox() {
    const D = 2000, g = this.add.graphics().setDepth(D);
    this.sbLane = -1; this.sbCount = 1; this.sbHist = []; this.sbAcc = 0;
    // нижняя панель: дорожка, количество, монстры, очистка
    hudPanel(g, 200, 772, 1390, 118, { fill: 0x0e1628, alpha: 0.94 });
    this.add.text(222, 790, t('sbLane'), TXT(16, '#aebbd4')).setDepth(D);
    const laneBtns = [];
    [-1, 0, 1, 2, 3, 4].forEach((l, i) => {
      const b = hudButton(this, 248 + i * 50, 842, 44, 48, l < 0 ? '∗' : String(l + 1), 0x24406e, () => { this.sbLane = l; laneBtns.forEach((x, k) => x.setFrame(k === i ? HUD_FRAME.sel : null)); }, 20).setDepth(D);
      laneBtns.push(b);
    });
    laneBtns[0].setFrame(HUD_FRAME.sel);
    const cnt = hudButton(this, 580, 842, 66, 48, '×1', 0x3a2f5a, () => { this.sbCount = this.sbCount === 1 ? 5 : this.sbCount === 5 ? 10 : 1; cnt.tx.setText('×' + this.sbCount); }, 20).setDepth(D);
    this.add.text(622, 790, t('sbSpawn'), TXT(16, '#aebbd4')).setDepth(D);
    // только монстры, которые уже встречались в кампании (как в Кодексе)
    const seen = Object.keys(MONSTERS).filter(id => metMonster(Save.data, id));
    if (!seen.length) this.add.text(660, 842, t('sbNoMon'), TXT(17, '#8a93a6', false)).setOrigin(0, 0.5).setDepth(D);
    seen.forEach((id, i) => {
      const x = 660 + i * 62, bg = this.add.graphics().setDepth(D);
      bg.fillStyle(0x0b1120, 0.95); bg.fillRoundedRect(x - 28, 814, 56, 56, 10); bg.lineStyle(2, TIER_COLOR[MONSTERS[id].tier] || 0x9aa4b5); bg.strokeRoundedRect(x - 28, 814, 56, 56, 10);
      fitTex(this.add.image(x, 842, MONSTERS[id].tex), 48, 46, MONSTERS[id].texBB).setDepth(D);
      this.add.rectangle(x, 842, 56, 56, 0, 0.001).setDepth(D).setInteractive({ useHandCursor: true }).on('pointerdown', () => this.spawnTest(id));
    });
    hudButton(this, 1520, 842, 110, 60, t('sbClear'), 0x5a2a2a, () => { for (const mo of this.monsters) if (!mo.dead) this.killMonster(mo, true); }, 18).setDepth(D);
    // таблица урона справа: открывается кнопкой «Урон» под «Убрать», закрывается ей же или крестиком
    this.sbPanel = this.add.container(0, 0).setDepth(D);
    const PY = 176, pg = this.add.graphics(); hudPanel(pg, 1236, PY, 350, 360, { fill: 0x0e1628, alpha: 0.92 });
    this.sbText = this.add.text(1254, PY + 48, '', TXT(15, '#dfe7f2', false, { lineSpacing: 5, fontFamily: 'Consolas, "Courier New", monospace' }));
    this.sbPanel.add([pg, this.add.text(1254, PY + 18, t('sbStats'), TXT(20, '#ffe27a')), this.sbText]);
    this.sbPanel.add(hudButton(this, 1476, PY + 24, 86, 34, t('sbReset'), 0x2a3140, () => { for (const k in this.usage) this.usage[k].dmg = 0; this.kills = 0; this.sbHist = []; }, 15));
    const tb = hudButton(this, HUD.recycleX, 142, 96, 40, t('sbStatsBtn'), 0x24406e, () => showStats(!this.sbPanel.visible), 17).setDepth(D);
    const showStats = v => { this.sbPanel.setVisible(v); tb.setFrame(v ? HUD_FRAME.sel : null); };
    this.sbPanel.add(hudButton(this, 1552, PY + 24, 40, 34, '✕', 0x5a2a2a, () => showStats(false), 18));
    showStats(true);
  }
  spawnTest(id) {
    for (let k = 0; k < this.sbCount; k++) {
      const l = this.sbLane >= 0 ? this.sbLane : pick(this.m.lanes);
      this.spawnMonster(id, l, rand(LAYOUT.spawnMin, LAYOUT.spawnMax) + k * 40);
    }
    Sound.play('click');
  }
  sandboxTick(dt) {
    this.energy = 9999;
    for (const id in this.cardCd) this.cardCd[id] = 0;
    this.sbAcc += dt; if (this.sbAcc < 0.5) return; this.sbAcc = 0;
    // урон в секунду — по последним 10 с
    const snap = {}; for (const id in this.usage) snap[id] = this.usage[id].dmg;
    this.sbHist.push({ t: this.t, snap }); while (this.sbHist.length && this.t - this.sbHist[0].t > 10) this.sbHist.shift();
    const old = this.sbHist[0], span = Math.max(1, this.t - old.t);
    const rows = Object.keys(this.usage).filter(id => MECHS[id]).map(id => {
      const u = this.usage[id], dps = (u.dmg - (old.snap[id] || 0)) / span;
      return { id, dmg: u.dmg, dps, placed: u.placed };
    }).sort((a, b) => b.dps - a.dps || b.dmg - a.dmg);
    const lines = rows.slice(0, 11).map(r => `${N(MECHS[r.id].name).slice(0, 18).padEnd(19)} ${String(Math.round(r.dps)).padStart(5)}/с  ${fmtNum(Math.round(r.dmg))}`);
    this.sbText.setText([`${t('kills')}: ${this.kills || 0}    ${t('sbDpsHint')}`, '', ...lines].join('\n'));
  }

  // Награда Осады: монетки и лом с монстров + за каждый флаг ENDLESS_FLAG; начисляется один раз (и при досрочном выходе)
  endlessPay() {
    if (this.endlessPaid) return this.endlessPaid;
    const unused = Object.values(this.sweepers).filter(s => s.state === 'ready').length;
    const score = this.killValue * 100 + this.flags * 2500 + unused * 500 + this.bestStreak * 150;
    const d = Save.data, best = score > d.endless.score;
    if (best) d.endless = { score, flags: this.flags };
    const endCr = Math.round(this.runCredits * ECON.credits) + this.flags * ENDLESS_FLAG.credits, endSc = this.runScrap + this.flags * ENDLESS_FLAG.scrap;
    d.scrap += endSc; d.credits += endCr; Save.save();
    Analytics.track('endless_end', { score, flags: this.flags, assisted: false }); Analytics.flush();
    return (this.endlessPaid = { score, endCr, endSc });
  }
  async endlessOver() {
    const { score, endCr, endSc } = this.endlessPay(), d = Save.data;
    let lb = t('lbLogin');
    this.overlay(t('endlessOver'), [
      [`${t('score')}: ${fmtNum(score)}`, 52, '#ffd23d'],
      [`${t('flags')}: ${this.flags}    ${t('best')}: ${fmtNum(d.endless.score)}`, 26],
      [`${t('credits')} +${endCr}    ${t('scrap')} +${endSc}`, 26, '#ffe27a'],
    ], [
      [t('retry'), 0x3b5b8c, () => this.leave(() => this.restart()), 'ic_retry'],
      [t('menu'), 0x3a3f4b, () => this.leave(() => this.scene.start('Menu')), 'ic_home'],
    ], (c, y) => {
      const tx = this.add.text(W / 2, y + 20, Sdk.authorized() ? '' : lb, TXT(20, '#aebbd4', false)).setOrigin(0.5); c.add(tx);
      if (Sdk.authorized()) Sdk.submitScore(score).then(ok => { if (ok && tx.active) tx.setText(t('lbSent')); });
    });
  }
}
