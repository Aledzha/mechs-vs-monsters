<!-- Шрифт заголовков и кнопок (кириллица). Для релиза в Яндекс Играх положите шрифт в архив и подключите локально через @font-face -->
<link href="russo-one.css" rel="stylesheet">
<style>
:root{--bg:#0e1420;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1420}}
:root[data-theme="dark"]{--bg:#0e1420}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{width:100%;height:100%}
/* телефон в книжной ориентации — просим повернуть (игра рассчитана на альбомный экран 16:9) */
#rotate{display:none;position:fixed;inset:0;z-index:10;background:#0e1420;color:#ffe27a;font:22px "Russo One","Segoe UI",sans-serif;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:24px}
#rotate .ph{width:70px;height:120px;border:6px solid #7fb6ff;border-radius:14px;position:relative;animation:rot 2.2s ease-in-out infinite}
#rotate .ph:after{content:"";position:absolute;left:50%;bottom:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#7fb6ff}
#rotate small{color:#c9d3e3;font-size:16px}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>

// Названия миссий: «зона-номер внутри зоны» (Свалка-01 … Литейная-10)
const MISSION_PREFIX = { ru: { surface: 'Свалка', blackout: 'Литейная' }, en: { surface: 'Scrapyard', blackout: 'Foundry' } };
let LANG = 'ru';
function setLang(l) { LANG = STRINGS[l] ? l : (l === 'tr' ? 'en' : 'en'); }
function detectLang(sdkLang) {
  const s = (sdkLang || navigator.language || 'ru').slice(0, 2).toLowerCase();
  return ['ru', 'be', 'kk', 'uk', 'uz'].includes(s) ? 'ru' : (s === 'tr' ? 'tr' : 'en');
}
function t(key, vars) {
  let s = (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
const N = o => (o && (o[LANG] || o.en)) || '';
function missionName(i) {
  const m = MISSIONS[i]; if (!m) return '';
  if (m.secret) {   // до победы — «???», потом «Тайник-N»
    const n = MISSIONS.slice(0, i + 1).filter(x => x.secret).length;
    return typeof Save !== 'undefined' && Save.data.cleared[i] ? (LANG === 'ru' ? 'Тайник-' : 'Cache-') + n : '???';
  }
  let n = 0; for (let k = 0; k <= i; k++) if (MISSIONS[k].zone === m.zone) n++;
  return ((MISSION_PREFIX[LANG] || MISSION_PREFIX.en)[m.zone] || m.zone) + '-' + String(n).padStart(2, '0');
}
function fmtNum(n) { try { return new Intl.NumberFormat(LANG).format(n); } catch (e) { return String(n); } }

// Слоты колоды: 6 сразу, ещё 3 покупаются за золото в Мастерской — каждый открывается после своей миссии
// Машинки-чистильщики: сначала 2, ещё 3 покупаются в Мастерской. В бою встают на случайные открытые дорожки (каждая на свою).
const SWEEPERS = { start: 2, max: 5, shop: [250, 500, 900], after: 3 };   // after — магазин открывается после этой миссии
const SLOTS = { base: 6, max: 9, shop: [{ after: 5, cost: 200 }, { after: 10, cost: 450 }, { after: 15, cost: 800 }] };
// Прокачка мехов (Мастерская): ранги 1–4. Ранги 2–3 усиливают основной параметр меха (rankStat), ранг 4 открывает perk.
const RANKS = {
  max: 4,
  cost: [0, 0, 50, 150, 350],          // деталей (гаек) за переход на ранг N
  gold: [0, 0, 100, 250, 600],         // и золота
  after: [0, 0, 4, 10, 16],            // ранг N открывается после этой миссии кампании (нельзя сразу всё прокачать фармом)
  hp: [1, 1, 1.05, 1.1, 1.1],          // прочность
  dps: [1, 1, 1.04, 1.08, 1.08],       // скорострельность
  prod: [1, 1, 1.04, 1.08, 1.08],      // скорость производства
  util: [1, 1, 0.95, 0.9, 0.9],        // перезарядка карточки

const rankMul = (stat, r) => (RANKS[stat] || [])[Math.min(r || 1, RANKS.max)] || 1;
const WORKSHOP = { trapCredits: 200, trapMax: 5, trapAfter: 4 };
const CODEX_AFTER = 4, ENDLESS_AFTER = 20;
// Монстры, которых игрок мог встретить: из пройденных миссий и Испытаний (с призывами, воющим на огромных волнах, гнёздами).
// Отметки Кодекса (codexZ) пересекаются с этим списком — так старые отметки из Полигона не открывают лишнего.
function reachableMonsters(d) {
  const set = new Set(), add = m => {
    for (const id in m.pool || {}) { set.add(id); const s = MONSTERS[id] && MONSTERS[id].summon; if (s) set.add(s.id); }
    if (m.howler) set.add('howler');
    if (m.nests) { set.add('grunt'); set.add('hornshell'); }
  };
  MISSIONS.forEach((m, i) => { if (d.cleared[i]) add(m); });
  BONUS.forEach(b => { if (d.cleared[b.after - 1]) add(b); });
  if (d.cleared[ENDLESS_AFTER - 1]) Object.keys(MONSTERS).forEach(id => set.add(id));
  return set;
}
const metMonster = (d, id) => !!d.codexZ[id] && reachableMonsters(d).has(id);

function mechsAvailableUpTo(missionIdx) {
  const s = [];
  for (let i = 0; i <= missionIdx && i < MISSIONS.length; i++) for (const id of MISSIONS[i].unlock) if (!s.includes(id)) s.push(id);
  return s;
}

// =====================================================================
//  СОХРАНЕНИЯ (GDD разд. 25): localStorage + облако Яндекса
// =====================================================================
const SAVE_VERSION = 3;
const newSave = () => ({
  saveVersion: SAVE_VERSION, reached: 1, stars: {}, cleared: {}, credits: 0, scrap: 0, ranks: {}, slotsBought: 0, sweepersOwned: SWEEPERS.start,
  codexZ: {}, traps: 0, settings: { music: 60, sfx: 80, lang: null },
  endless: { score: 0, flags: 0 }, bonusBest: {}, sinceAd: 0, sessions: 0, updatedAt: 0,
});
const MIGRATIONS = {
  // 1 → 2: кампания стала из 20 миссий (по одному меху за миссию). Миссии поверхности 1–6 совпадают,
  // старая M6 открывала ещё и Дробитель (теперь M7); прогресс в Blackout начинается заново. Валюта и ранги сохраняются.
  1: d => {
    const cleared = {}, stars = {};
    for (let i = 0; i < 6; i++) if (d.cleared && d.cleared[i]) { cleared[i] = true; stars[i] = (d.stars || {})[i] || 1; }
    if (cleared[5]) { cleared[6] = true; stars[6] = stars[5]; }
    let reached = 1; while (cleared[reached - 1]) reached++;
    Object.assign(d, { cleared, stars, reached, saveVersion: 2 });
    return d;
  },
  // 2 → 3: слоты колоды теперь покупаются. Бесплатно полученные раньше (после M7 и M14) считаются купленными.
  2: d => { d.slotsBought = (d.cleared[6] ? 1 : 0) + (d.cleared[13] ? 1 : 0); d.saveVersion = 3; return d; },
};
const Save = {
  key: 'mvm_save', data: newSave(), _t: null,
  migrate(d) {
    const base = newSave();
    d = Object.assign(base, d || {});
    d.settings = Object.assign(newSave().settings, d.settings || {});
    while (d.saveVersion < SAVE_VERSION && MIGRATIONS[d.saveVersion]) d = MIGRATIONS[d.saveVersion](d);
    d.credits = Math.max(0, d.credits || 0); d.scrap = Math.max(0, d.scrap || 0);   // страховка от ухода в минус
    return d;
  },
  loadLocal() { try { const s = localStorage.getItem(this.key); if (s) this.data = this.migrate(JSON.parse(s)); } catch (e) {} },
  async loadCloud() {
    const c = await Sdk.getCloud();
    if (c && (c.updatedAt || 0) > (this.data.updatedAt || 0)) { this.data = this.migrate(c); this.writeLocal(); }
  },
  writeLocal() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
  save() {
    this.data.updatedAt = Date.now();
    this.writeLocal();
    clearTimeout(this._t);
    this._t = setTimeout(() => Sdk.setCloud(this.data), 1500);
  },
  reset() { const s = this.data.settings; this.data = newSave(); this.data.settings = s; this.save(); },
  slots() { return SLOTS.base + Math.min(this.data.slotsBought || 0, SLOTS.shop.length); },
  rank(id) { return this.data.ranks[id] || 1; },
  // Отладка (только localhost): ?devsave=full — пройдены 20 миссий кампании на 3★, по 10000 кредитов и лома.
  // Ссылку открыть один раз, потом лучше убрать параметр из адреса, иначе ресурсы будут снова выставляться.
  devPreset() {
    if (!DEV || !/^(localhost|127.0.0.1)$/.test(location.hostname) || !/[?&]devsave=full(&|$)/.test(location.search)) return;
    const d = this.data;
    for (let i = 0; i < CAMPAIGN_N; i++) { d.cleared[i] = true; d.stars[i] = Math.max(d.stars[i] || 0, 3); }
    d.reached = CAMPAIGN_N; d.credits = 10000; d.scrap = 10000;
    console.info('[devsave] пройдены все миссии кампании, 10000 кредитов и лома');
  },
};

//  YANDEX GAMES SDK (GDD разд. 32) + mock для разработки

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
const Sdk = {
  ysdk: null, player: null, isYa: false, lang: null, _ready: false, _playing: false, adOpen: false,
  shouldLoad() { return !!window.YaGames || /yandex|playhop|games\.s3/i.test(location.hostname); },
  async init() {
    if (!this.shouldLoad()) return;
    try {
      if (!window.YaGames) await loadScript('/sdk.js');
      this.ysdk = await window.YaGames.init();
      this.isYa = true;
      this.lang = this.ysdk.environment && this.ysdk.environment.i18n && this.ysdk.environment.i18n.lang;
      try { this.player = await this.ysdk.getPlayer({ scopes: false }); } catch (e) { this.player = null; }
      if (this.ysdk.on) {
        this.ysdk.on('game_api_pause', () => Bus.emit('sdkPause'));
        this.ysdk.on('game_api_resume', () => Bus.emit('sdkResume'));
      }
    } catch (e) { console.warn('Yandex SDK недоступен, работает mock', e); this.ysdk = null; }
  },
  loadingReady() {
    if (this._ready) return; this._ready = true;
    try { this.ysdk && this.ysdk.features.LoadingAPI && this.ysdk.features.LoadingAPI.ready(); } catch (e) {}
  },
  gameplay(on) {
    if (this._playing === on) return; this._playing = on;
    try { const g = this.ysdk && this.ysdk.features.GameplayAPI; if (g) on ? g.start() : g.stop(); } catch (e) {}
  },
  async getCloud() { try { if (this.player) { const d = await this.player.getData(['save']); return d && d.save; } } catch (e) {} return null; },
  setCloud(data) { try { if (this.player) this.player.setData({ save: data }, false); } catch (e) {} },
  authorized() { try { return !!this.player && (this.player.isAuthorized ? this.player.isAuthorized() : this.player.getMode() !== 'lite'); } catch (e) { return false; } },
  async submitScore(score) {
    if (!this.ysdk || !this.authorized()) return false;
    try {
      if (this.ysdk.leaderboards && this.ysdk.leaderboards.setScore) await this.ysdk.leaderboards.setScore('endless', score);
      else { const lb = await this.ysdk.getLeaderboards(); await lb.setLeaderboardScore('endless', score); }
      return true;
    } catch (e) { return false; }
  },
  _open() { this.adOpen = true; this.gameplay(false); Bus.emit('adOpen'); },
  _close() { this.adOpen = false; Bus.emit('adClose'); },
  showInterstitial() {
    return new Promise(res => {
      if (!this.ysdk) return this._mock(false).then(() => res());
      try {
        this.ysdk.adv.showFullscreenAdv({ callbacks: {
          onOpen: () => this._open(),
          onClose: () => { this._close(); res(); },
          onError: () => { this._close(); res(); },
        } });
      } catch (e) { res(); }
    });
  },
  showRewarded() {
    return new Promise(res => {
      if (!this.ysdk) return this._mock(true).then(res);
      let rewarded = false;
      try {
        this.ysdk.adv.showRewardedVideo({ callbacks: {
          onOpen: () => this._open(),
          onRewarded: () => { rewarded = true; },
          onClose: () => { this._close(); res(rewarded); },
          onError: () => { this._close(); res(false); },
        } });
      } catch (e) { res(false); }
    });
  },
  _mock(rewarded) {
    return new Promise(res => {
      this._open();
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,24,.92);color:#ffe27a;display:flex;align-items:center;justify-content:center;font:bold 28px ' + FONT + ';z-index:99';
      d.textContent = t('adStub') + (rewarded ? ' ✓' : '');
      document.body.appendChild(d);
      setTimeout(() => { d.remove(); this._close(); res(rewarded); }, 1200);
    });
  },
};

//  ГРАФИКА ИЗ ПАПКИ АССЕТОВ (C:\Games\Rvm)

// =====================================================================
const ASSET_ROOT = './';

// id в коде → имя папки ассетов

  cryo: { bolt: 'cryo_bolt', muzzle: 'cryo_muzzle', impact: 'cryo_impact' },

// Видимая высота персонажа на поле (px в координатах 1600×900) — только для сырой графики без нормализации.
// Для assets/game размеры задаются рамками BOX в tools/rvm-normalize.mjs.
const ART_TUNING = {
  mechs: { default: 118, bulwark: 132, mine: 56, pocket: 84, longshot: 128, solar: 110, hammer: 110 },
  monsters: { default: 124, brood: 88, rush: 142, relic: 158, gatebreaker: 130 },
  fx: { pulse_bolt: 26, pulse_muzzle: 54, pulse_impact: 70, default: 60 },
};
// Скорость и зацикленность анимаций по умолчанию (если в manifest.json не указано)
const ANIM_DEFAULTS = {
  idle: [6, true], walk: [8, true], attack: [8, true], aim: [10, false], fire: [20, false], deploy: [12, false],
  overheat: [8, true], hit: [14, false], destroy: [10, false], death: [10, false], enter: [10, false], loop: [16, true], play: [24, false],
};

// Сырые исходники (1254×1254 ≈ 6 МБ видеопамяти на кадр) после загрузки ужимаются до этой стороны.
// Нормализованные кадры из assets/game (400×400) не трогаются.
const ART_MAX_SIDE = 512;

const Art = {
  index: null, units: {}, fx: {},
  key(cat, id, anim, i) { return `A:${cat}:${id}:${anim}:${i}`; },
  // ---- загрузка ----
  queue(loader) {
    const ix = this.index; if (!ix) return 0;
    // графику юнитов, которых ещё нет в игре, не грузим
    const used = cat => new Set(Object.values(ASSET_IDS[cat]).concat(Object.keys(cat === 'mechs' ? MECHS : MONSTERS)));
    const want = { mechs: used('mechs'), monsters: used('monsters') };
    loader.on('filecomplete', key => { if (String(key).startsWith('A:')) this.shrink(loader.scene, key); });
    let n = 0;
    // интерфейс и окружение (assets/game/ui): ключ = имя файла, заменяет одноимённую заглушку (orb, sweeper, nest, bg_menu…)
    for (const [key, f] of Object.entries(ix.ui || {})) if (!loader.scene.textures.exists(key)) { loader.image(key, ASSET_ROOT + f); n++; }
    for (const cat of ['mechs', 'monsters', 'projectiles', 'fx']) {
      for (const [id, u] of Object.entries(ix[cat] || {})) {
        if (want[cat] && !want[cat].has(id)) continue;
        if (u.master) { loader.image(this.key(cat, id, 'master', 0), ASSET_ROOT + u.master); n++; }
        for (const [anim, frames] of Object.entries(u.anims || {})) frames.forEach((f, i) => { loader.image(this.key(cat, id, anim, i), ASSET_ROOT + f); n++; });
      }
    }
    return n;
  },
  shrink(scene, key) {
    if (!scene.textures.exists(key)) return;
    const img = scene.textures.get(key).getSourceImage(), w = img.width, h = img.height;
    const k = ART_MAX_SIDE / Math.max(w, h); if (!(k < 1)) return;
    const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    const ctx = cv.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, cv.width, cv.height);
    scene.textures.remove(key); scene.textures.addCanvas(key, cv);
  },
  // ---- разбор manifest.json (формат гибкий) ----
  parseManifest(man) {
    const m = man || {};
    const pair = v => v == null ? null : Array.isArray(v) ? { x: +v[0], y: +v[1] } : { x: +(v.x ?? v.w ?? v.width), y: +(v.y ?? v.h ?? v.height) };
    const canvas = pair(m.canvas || m.frameSize || m.frame_size || m.size);
    const anchor = pair(m.anchor || m.pivot || m.origin || (m.canvas && m.canvas.anchor));
    const muzzle = pair(m.muzzle || (m.points && m.points.muzzle) || (m.sockets && m.sockets.muzzle) || (m.attach && m.attach.muzzle));
    let facing = String(m.direction || m.facing || m.dir || '').toLowerCase();
    facing = facing.includes('left') ? 'left' : facing.includes('right') ? 'right' : '';
    const anims = {};
    const raw = m.animations || m.anims || {};
    const list = Array.isArray(raw) ? raw : Object.entries(raw).map(([name, v]) => Object.assign({ name }, typeof v === 'object' ? v : {}));
    for (const a of list) if (a && a.name) anims[a.name] = { fps: +(a.fps || a.frameRate || a.frame_rate) || 0, loop: a.loop == null ? null : !!a.loop };
    // pixelScale — кадры уже в единой сетке (tools/rvm-normalize.mjs): px текстуры → px поля
    return { canvas, anchor, muzzle, facing, anims, height: +(m.gameHeight || m.displayHeight || 0) || 0, pixelScale: +m.pixelScale || 0 };
  },
  // Габариты непрозрачной части картинки (чтобы масштабировать и ставить «на ноги» без ручной подгонки)
  bbox(scene, key) {
    try {
      const img = scene.textures.get(key).getSourceImage(), w = img.width, h = img.height;
      const k = Math.min(1, 256 / Math.max(w, h)), cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cw, ch);
      const d = ctx.getImageData(0, 0, cw, ch).data;
      let x0 = cw, y0 = ch, x1 = -1, y1 = -1;
      for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) if (d[(y * cw + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) return { x: 0, y: 0, w, h, W: w, H: h };
      return { x: x0 / k, y: y0 / k, w: (x1 - x0 + 1) / k, h: (y1 - y0 + 1) / k, W: w, H: h };
    } catch (e) { const f = scene.textures.getFrame(key); return { x: 0, y: 0, w: f.width, h: f.height, W: f.width, H: f.height }; }
  },
  // Концы стволов по пикселям спрайта: для каждой строки — самый правый непрозрачный пиксель,
  // стволы — группы строк, где он почти на максимуме (ноги, нижнюю четверть силуэта, не смотрим).
  barrels(scene, key) {
    try {
      const img = scene.textures.get(key).getSourceImage(), W = img.width, H = img.height;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
      const d = cx.getImageData(0, 0, W, H).data, op = (x, y) => d[(y * W + x) * 4 + 3] > 60;
      let top = H, bot = 0;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (op(x, y)) { if (y < top) top = y; bot = y; break; }
      const yMax = Math.round(bot - (bot - top) * 0.25), rx = {};
      let xmax = -1;
      for (let y = top; y <= yMax; y++) for (let x = W - 1; x >= 0; x--) if (op(x, y)) { rx[y] = x; if (x > xmax) xmax = x; break; }
      const tol = Math.max(3, W * 0.018), cl = [];
      for (let y = top; y <= yMax; y++) if (rx[y] >= xmax - tol) { const c = cl[cl.length - 1]; if (c && y - c.y1 <= 3) c.y1 = y; else cl.push({ y0: y, y1: y }); }
      return cl.map(c => { let x = 0; for (let y = c.y0; y <= c.y1; y++) x = Math.max(x, rx[y]); return { x, y: (c.y0 + c.y1) / 2, h: c.y1 - c.y0 + 1 }; });
    } catch (e) { return []; }
  },
  build(scene) {
    const ix = this.index; if (!ix) return;
    for (const cat of ['mechs', 'monsters']) {
      const codeIds = Object.keys(cat === 'mechs' ? MECHS : MONSTERS);
      for (const codeId of codeIds) {
        const aid = (ASSET_IDS[cat] || {})[codeId], u = (ix[cat] || {})[aid] || (ix[cat] || {})[codeId];
        if (!u) continue;
        const folder = (ix[cat] || {})[aid] ? aid : codeId;
        const man = this.parseManifest(u.manifest);
        const animNames = Object.keys(u.anims || {});
        let baseKey = u.master ? this.key(cat, folder, 'master', 0) : null;
        const firstAnim = animNames.find(n => ['idle', 'walk'].includes(n)) || animNames[0];
        if (!baseKey && firstAnim) baseKey = this.key(cat, folder, firstAnim, 0);
        if (!baseKey || !scene.textures.exists(baseKey)) continue;
        const bb = this.bbox(scene, baseKey), W0 = bb.W, H0 = bb.H;
        // якорь: из manifest (px или 0..1), иначе — низ непрозрачной части по центру
        let ax, ay;
        if (man.anchor && isFinite(man.anchor.x) && isFinite(man.anchor.y)) {
          const cw = (man.canvas && man.canvas.x) || W0, chh = (man.canvas && man.canvas.y) || H0;
          ax = man.anchor.x > 1 ? man.anchor.x / cw : man.anchor.x; ay = man.anchor.y > 1 ? man.anchor.y / chh : man.anchor.y;
        } else { ax = (bb.x + bb.w / 2) / W0; ay = (bb.y + bb.h) / H0; }
        const tune = ART_TUNING[cat];
        const scale = man.pixelScale || (man.height || tune[codeId] || tune.default) / bb.h;
        const targetH = (ay * H0 - bb.y) * scale;   // высота силуэта над землёй
        const want = cat === 'mechs' ? 'right' : 'left';
        const flip = !!man.facing && man.facing !== want;
        // дуло: из manifest, иначе примерно у переднего края силуэта на 38% высоты
        let mx, my;
        if (man.muzzle && isFinite(man.muzzle.x)) {
          const px = man.muzzle.x <= 1 ? man.muzzle.x * W0 : man.muzzle.x, py = man.muzzle.y <= 1 ? man.muzzle.y * H0 : man.muzzle.y;
          mx = (px - ax * W0) * scale; my = (py - ay * H0) * scale;
        } else { mx = (bb.x + bb.w * 0.94 - ax * W0) * scale; my = (bb.y + bb.h * 0.38 - ay * H0) * scale; }
        if (flip) mx = -mx;
        // у стреляющих мехов дула ищем по картинке — так точнее, чем прикидка в manifest
        let muzzles = [{ x: mx, y: my }];
        const md = cat === 'mechs' && MECHS[codeId] && /shooter|beam/.test(MECHS[codeId].kind) ? this.barrels(scene, baseKey) : [];
        if (md.length) {
          const conv = b => ({ x: (flip ? -1 : 1) * (b.x - ax * W0) * scale, y: (b.y - ay * H0) * scale });
          const multi = ((MECHS[codeId].attack || {}).shots || 1) > 1 && md.length > 1;
          muzzles = multi ? md.map(conv) : [conv(md.reduce((a, b) => b.h > a.h ? b : a))];
          mx = muzzles[0].x; my = muzzles[0].y;
        }
        const anims = {};
        for (const name of animNames) {
          const frames = u.anims[name], key = `${cat}:${folder}:${name}`;
          const def = ANIM_DEFAULTS[name] || [10, false], mm = man.anims[name] || {};
          if (!scene.anims.exists(key)) scene.anims.create({ key, frames: frames.map((_, i) => ({ key: this.key(cat, folder, name, i) })), frameRate: mm.fps || def[0], repeat: (mm.loop == null ? def[1] : mm.loop) ? -1 : 0 });
          anims[name] = { key };
        }
        this.units[cat + ':' + codeId] = { base: baseKey, ox: ax, oy: ay, scale, flip, mx, my, muzzles, h: targetH, w: bb.w * scale, anims };
        Object.assign((cat === 'mechs' ? MECHS : MONSTERS)[codeId], { tex: baseKey, texBB: bb });   // иконки в меню/кодексе
      }
    }
    for (const cat of ['projectiles', 'fx']) for (const [id, u] of Object.entries(ix[cat] || {})) {
      const names = Object.keys(u.anims || {}); if (!names.length) continue;
      const name = names.includes('loop') ? 'loop' : names[0], frames = u.anims[name], key = `${cat}:${id}`;
      const man = this.parseManifest(u.manifest), ma = Object.values(man.anims);
      const mm = man.anims[name] || (ma.length === 1 ? ma[0] : {});   // кадры без имени анимации в файле
      const def = cat === 'projectiles' ? [16, true] : [24, false];
      if (!scene.anims.exists(key)) scene.anims.create({ key, frames: frames.map((_, i) => ({ key: this.key(cat, id, name, i) })), frameRate: mm.fps || def[0], repeat: (mm.loop == null ? def[1] : mm.loop) ? -1 : 0 });
      const k0 = this.key(cat, id, name, 0), bb = this.bbox(scene, k0);
      const targetH = man.height || ART_TUNING.fx[id] || ART_TUNING.fx.default;
      let ox = 0.5, oy = 0.5;
      if (man.anchor && isFinite(man.anchor.x)) { ox = man.anchor.x > 1 ? man.anchor.x / bb.W : man.anchor.x; oy = man.anchor.y > 1 ? man.anchor.y / bb.H : man.anchor.y; }
      this.fx[id] = { key, base: k0, scale: man.pixelScale || targetH / Math.max(8, bb.h), ox, oy, flip: man.facing === 'left' };
    }
  },
  unit(cat, id) { return this.units[cat + ':' + id] || null; },
  // ---- создание спрайтов ----
  sprite(scene, cat, id, x, y, placeholder) {
    const u = this.unit(cat, id);
    if (!u) { const s = scene.add.sprite(x, y, placeholder).setOrigin(0.5, 0.95); s.art = null; s.baseScale = 1; return s; }
    const s = scene.add.sprite(x, y, u.base).setOrigin(u.ox, u.oy).setScale(u.scale).setFlipX(u.flip);
    s.art = u; s.baseScale = u.scale;
    return s;
  },
  muzzles(cat, id) { const u = this.unit(cat, id); return u && u.muzzles ? u.muzzles : [this.muzzle(cat, id)]; },
  muzzle(cat, id) { const u = this.unit(cat, id); return u ? { x: u.mx, y: u.my } : (cat === 'mechs' ? { x: 58, y: -52 } : { x: -30, y: -60 }); },
  height(cat, id, fallback) { const u = this.unit(cat, id); return u ? u.h : fallback; },
};

// Базовая (фоновая) анимация: не перебивает одноразовые
function animBase(s, name, alt) {
  if (!s || !s.art || !s.active || s.oneShot) return;
  const a = s.art.anims[name] || (alt && s.art.anims[alt]) || s.art.anims.idle || s.art.anims.walk;
  if (!a) { if (s.anims.currentAnim) { s.anims.stop(); s.setTexture(s.art.base); } return; }
  if (!s.anims.currentAnim || s.anims.currentAnim.key !== a.key) s.play(a.key);
}
// Одноразовая анимация; по окончании вызывает onDone. Возвращает false, если такой анимации нет.
function animOnce(s, name, onDone) {
  if (!s || !s.art || !s.active) return false;
  const a = s.art.anims[name]; if (!a) return false;
  if (s._onceEvt) s.off(s._onceEvt);
  s.oneShot = true; s.play(a.key);
  s._onceEvt = 'animationcomplete-' + a.key;
  s.once(s._onceEvt, () => { s._onceEvt = null; s.oneShot = false; if (onDone) onDone(); });
  return true;
}
// Разовый эффект (вспышка, попадание)
let FX_ALIVE = 0;
function playFx(scene, id, x, y, depth, flip, mul = 1) {
  const f = Art.fx[id]; if (!f || FX_ALIVE > 40) return false;
  FX_ALIVE++;
  const s = scene.add.sprite(x, y, f.base).setOrigin(f.ox, f.oy).setScale(f.scale * mul).setDepth(depth).setFlipX(!!flip !== !!f.flip);
  s.play(f.key);
  s.once('animationcomplete-' + f.key, () => { FX_ALIVE--; s.destroy(); });
  return true;
}
function fitImage(img, w, h) { img.setScale(Math.min(w / img.width, h / img.height)); return img; }
// Персонаж стоит ногами в точке (x, y) и вписан в рамку w×h по непрозрачной части
function standImage(scene, x, y, def, w, h) {
  const img = scene.add.image(x, y, def.tex), bb = def.texBB;
  if (!bb) return fitImage(img.setOrigin(0.5, 1), w, h);
  return img.setOrigin((bb.x + bb.w / 2) / bb.W, (bb.y + bb.h) / bb.H).setScale(Math.min(w / bb.w, h / bb.h));
}
// Вписать по непрозрачной части (bb из Art.bbox), чтобы иконка не терялась в пустом холсте
function fitTex(img, w, h, bb) {
  if (!bb) return fitImage(img, w, h);
  img.setOrigin((bb.x + bb.w / 2) / bb.W, (bb.y + bb.h / 2) / bb.H);
  return img.setScale(Math.min(w / bb.w, h / bb.h));
}

// =====================================================================
//  АУДИО (GDD разд. 35). Всё синтезируется WebAudio на лету — без файлов, сборка остаётся лёгкой.
//  Музыка: мини-трекер (SONGS) — аккорды, мелодии и ритмы записаны текстом, играют синтезаторы (INST).
//  Эффекты: SFX — у каждого свой маленький «патч». Громкость — Save.data.settings.music / sfx.
// =====================================================================
const NOTE_IX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midiOf(n) {                                   // 'C#4' → 61
  const m = /^([A-G])([b#]?)(-?\d)$/.exec(n); if (!m) { console.warn('music: нота?', n); return 60; }
  return 12 * (+m[3] + 1) + NOTE_IX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const mhz = n => 440 * Math.pow(2, (n - 69) / 12);
function chordOf(sym) {                                // 'Dm' → { pc: 2, iv: [0, 3, 7] }
  const m = /^([A-G][b#]?)(m|dim|sus)?(7)?$/.exec(sym);
  const iv = m[2] === 'm' ? [0, 3, 7] : m[2] === 'dim' ? [0, 3, 6] : m[2] === 'sus' ? [0, 5, 7] : [0, 4, 7];
  if (m[3]) iv.push(m[2] === 'm' ? 10 : 10);
  return { pc: midiOf(m[1] + '0') % 12, iv };
}
// строка такта: 16 шестнадцатых через пробел; нота начинает звук, «-» тянет, «.» — пауза
function parseBar(str) {
  const tk = str.trim().split(/\s+/), ev = []; let cur = null;
  if (tk.length !== 16) console.warn('music: в такте', tk.length, 'долей:', str);
  tk.forEach((t, i) => {
    if (t === '-') { if (cur) cur.len++; }
    else if (t === '.') cur = null;
    else { cur = { step: i, n: midiOf(t), len: 1 }; ev.push(cur); }
  });
  return ev;
}

// A — «рабочий стол» текущего контекста: ctx, шум, каналы. Все функции ставят звук на время t.
const DRUM = {
  kick(A, out, t, v) {
    const o = A.ctx.createOscillator(), g = A.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(v * 0.75, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
    A.noise(out, t, 0.012, v * 0.18, 'highpass', 3500);
  },
  snare(A, out, t, v) {
    A.noise(out, t, 0.2, v * 0.32, 'bandpass', 1900, 0.8);
    A.tone(out, 'triangle', 210, 150, t, 0.11, v * 0.22);
  },
  hat(A, out, t, v) { A.noise(out, t, 0.045, v * 0.1, 'highpass', 7800); },
  ohat(A, out, t, v) { A.noise(out, t, 0.24, v * 0.075, 'highpass', 7000); },
  crash(A, out, t, v) { A.noise(out, t, 1.4, v * 0.12, 'highpass', 4800); A.noise(out, t, 0.6, v * 0.05, 'bandpass', 3000, 0.6); },
  // наковальня: несколько неровно настроенных «квадратов» через полосовой фильтр — металлический звон
  anvil(A, out, t, v) {
    const f = A.ctx.createBiquadFilter(), g = A.ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 1.2;
    g.gain.setValueAtTime(v * 0.09, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    f.connect(g); g.connect(out);
    for (const r of [1, 2.76, 5.41, 8.93]) { const o = A.ctx.createOscillator(); o.type = 'square'; o.frequency.value = 520 * r; o.connect(f); o.start(t); o.stop(t + 0.47); }
    A.noise(out, t, 0.03, v * 0.12, 'highpass', 5000);
  },
};

  // пэды: мягкая «подушка» аккордов
  warmPad(A, out, t, n, dur, v) { A.stack(out, t, n, dur, v * 0.032, ['sawtooth', 'sawtooth', 'sawtooth'], [-9, 0, 9], 'lowpass', 1300, 0.7, 0.5, 0.9); },
  darkPad(A, out, t, n, dur, v) { A.stack(out, t, n, dur, v * 0.034, ['sawtooth', 'sawtooth', 'sine'], [-7, 7, -1200], 'lowpass', 650, 1, 0.6, 1.0); },
  brightPad(A, out, t, n, dur, v) { A.stack(out, t, n, dur, v * 0.03, ['triangle', 'square', 'triangle'], [-6, 0, 1200], 'lowpass', 2200, 0.7, 0.25, 0.6); },
  // щипок: треугольник + прямоугольник через закрывающийся фильтр
  pluck(A, out, t, n, dur, v) {
    const f = A.ctx.createBiquadFilter(), g = A.ctx.createGain(), end = t + Math.max(0.28, dur);
    f.type = 'lowpass'; f.Q.value = 3; f.frequency.setValueAtTime(4200, t); f.frequency.exponentialRampToValueAtTime(700, t + 0.25);
    g.gain.setValueAtTime(v * 0.085, t); g.gain.exponentialRampToValueAtTime(0.001, end);
    f.connect(g); g.connect(out);
    for (const [ty, d] of [['triangle', 0], ['square', 6]]) A.osc(ty, mhz(n), t, end, d).connect(f);
  },
  // маримба: основной тон + четвёртая гармоника, быстро гаснет — «деревянный», весёлый
  marimba(A, out, t, n, dur, v) {
    A.tone(out, 'sine', mhz(n), mhz(n), t, 0.42, v * 0.13);
    A.tone(out, 'sine', mhz(n) * 4, mhz(n) * 4, t, 0.07, v * 0.05);
    A.tone(out, 'triangle', mhz(n) * 2, mhz(n) * 2, t, 0.12, v * 0.03);
  },
  synthBass(A, out, t, n, dur, v) { A.bass(out, t, n, dur, v * 0.13, ['sawtooth', 'square'], 1500, 280, 4, false); },
  bounceBass(A, out, t, n, dur, v) { A.bass(out, t, n, Math.min(dur, 0.2), v * 0.15, ['square', 'sine'], 1100, 260, 3, false); },
  distBass(A, out, t, n, dur, v) { A.bass(out, t, n, Math.min(dur, 0.16), v * 0.05, ['sawtooth', 'sine'], 1000, 320, 3, true); },
  heroLead(A, out, t, n, dur, v) { A.lead(out, t, n, dur, v * 0.085, ['sawtooth', 'square'], 2600, 5.5, 14, 0.02); },
  whistleLead(A, out, t, n, dur, v) { A.lead(out, t, n, dur, v * 0.08, ['square', 'triangle'], 3400, 6.2, 12, 0.01); },
  brassLead(A, out, t, n, dur, v) { A.lead(out, t, n, dur, v * 0.1, ['sawtooth', 'sawtooth'], 1600, 4.8, 10, 0.06, true); },
};

function makeAudioKit(ctx) {
  const len = ctx.sampleRate * 2, nb = ctx.createBuffer(1, len, ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
  // импульс для реверба: затухающий стерео-шум ~2.4 с
  const rl = Math.floor(ctx.sampleRate * 2.4), ir = ctx.createBuffer(2, rl, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < rl; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 3.2); }
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 6) * 0.8; }
  const A = {
    ctx, noiseBuf: nb, ir, curve,
    osc(type, f, t, end, det = 0) {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det; o.start(t); o.stop(end + 0.05); return o;
    },
    tone(out, type, f0, f1, t, dur, vol) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.03);
    },
    noise(out, t, dur, vol, ftype, f, q = 0.7, f1) {
      const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = nb; s.loop = true; fl.type = ftype; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
      if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02);
    },
    // слой осцилляторов через фильтр с медленной атакой — для пэдов
    stack(out, t, n, dur, vol, types, dets, ft, ff, q, att, rel) {
      const f = ctx.createBiquadFilter(), g = ctx.createGain(), end = t + dur + rel;
      f.type = ft; f.frequency.value = ff; f.Q.value = q;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.setValueAtTime(vol, t + dur); g.gain.exponentialRampToValueAtTime(0.0001, end);
      f.connect(g); g.connect(out);
      types.forEach((ty, i) => this.osc(ty, mhz(n), t, end, dets[i]).connect(f));
    },
    bass(out, t, n, dur, vol, types, f0, f1, q, dist) {
      const f = ctx.createBiquadFilter(), g = ctx.createGain(), end = t + dur + 0.08;
      f.type = 'lowpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + Math.min(0.25, dur + 0.05));
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006); g.gain.setValueAtTime(vol * 0.8, t + dur); g.gain.exponentialRampToValueAtTime(0.0001, end);
      let head = f;
      if (dist) { const ws = ctx.createWaveShaper(); ws.curve = curve; ws.connect(f); head = ws; }
      f.connect(g); g.connect(out);
      this.osc(types[0], mhz(n), t, end, 0).connect(head);
      this.osc(types[1], mhz(n - 12), t, end, 0).connect(f);
    },
    // соло: два осциллятора, вибрато включается с задержкой, у «меди» фильтр раскрывается на атаке
    lead(out, t, n, dur, vol, types, ff, vibHz, vibC, att, brass) {
      const f = ctx.createBiquadFilter(), g = ctx.createGain(), end = t + dur + 0.18;
      f.type = 'lowpass'; f.Q.value = 1.2;
      if (brass) { f.frequency.setValueAtTime(350, t); f.frequency.exponentialRampToValueAtTime(ff * 1.6, t + 0.09); f.frequency.exponentialRampToValueAtTime(ff, t + 0.3); }
      else f.frequency.value = ff;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.setValueAtTime(vol * 0.85, t + Math.max(att, dur - 0.02)); g.gain.exponentialRampToValueAtTime(0.0001, end);
      f.connect(g); g.connect(out);
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = vibHz; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(dur > 0.3 ? vibC : 0, t + Math.min(0.35, dur));
      lfo.connect(lg); lfo.start(t); lfo.stop(end + 0.05);
      types.forEach((ty, i) => { const o = this.osc(ty, mhz(n), t, end, i ? 6 : -4); lg.connect(o.detune); o.connect(f); });
    },
  };
  return A;
}

// ------------------------------------------------------------------ эффекты
// Каждый эффект — маленький патч: (A, out, t) → звук. Выстрелы у мехов разные (SHOT_SFX).
const SHOT_SFX = { twin: 'shootTwin', pocket: 'shootSmall', longshot: 'snipe' };
const SFX = {
  // Пульс-турель: короткий лазерный «пью» с щелчком
  shoot(A, o, t) { A.tone(o, 'square', 1500, 360, t, 0.09, 0.05); A.tone(o, 'sine', 420, 140, t, 0.07, 0.07); A.noise(o, t, 0.02, 0.05, 'highpass', 3000); },
  // спарка: выше и суше
  shootTwin(A, o, t) { A.tone(o, 'sawtooth', 1900, 620, t, 0.06, 0.035); A.tone(o, 'sine', 520, 200, t, 0.05, 0.05); A.noise(o, t, 0.015, 0.04, 'highpass', 4000); },
  // карманная пушка: лёгкий «пип»
  shootSmall(A, o, t) { A.tone(o, 'triangle', 1300, 520, t, 0.07, 0.07); A.noise(o, t, 0.012, 0.03, 'highpass', 5000); },
  // снайпер: хлёсткий щелчок и низкий хвост
  snipe(A, o, t) { A.noise(o, t, 0.13, 0.16, 'highpass', 1800); A.tone(o, 'square', 2600, 180, t, 0.14, 0.035); A.tone(o, 'sine', 110, 60, t, 0.22, 0.12); },
  // крио: ледяной звон
  cryo(A, o, t) { A.tone(o, 'sine', 2300, 900, t, 0.12, 0.05); A.tone(o, 'sine', 3450, 1500, t, 0.1, 0.025); A.noise(o, t, 0.14, 0.03, 'highpass', 6500); },
  // плазменный луч: гудящий разряд с раскрывающимся фильтром
  plasma(A, o, t) { A.noise(o, t, 0.2, 0.08, 'bandpass', 3000, 2, 400); A.tone(o, 'sawtooth', 180, 60, t, 0.2, 0.05); A.tone(o, 'sine', 95, 70, t, 0.2, 0.09); },
  hit(A, o, t) { A.noise(o, t, 0.05, 0.07, 'bandpass', 900, 1.2); A.tone(o, 'triangle', 220, 120, t, 0.05, 0.06); },
  explode(A, o, t) { A.noise(o, t, 0.7, 0.35, 'lowpass', 3200, 0.8, 160); A.tone(o, 'sine', 120, 32, t, 0.55, 0.4); A.noise(o, t, 0.05, 0.18, 'highpass', 2000); },
  monDie(A, o, t) { A.tone(o, 'triangle', 420, 70, t, 0.26, 0.13); A.noise(o, t, 0.16, 0.09, 'bandpass', 550, 1.5, 200); },
  mechDie(A, o, t) { A.noise(o, t, 0.45, 0.16, 'bandpass', 1500, 0.9, 300); A.tone(o, 'square', 300, 55, t, 0.38, 0.06); SFX.armorOff(A, o, t + 0.04); },
  place(A, o, t) { A.tone(o, 'triangle', 190, 90, t, 0.11, 0.16); A.noise(o, t, 0.035, 0.08, 'bandpass', 2600, 1.4); A.tone(o, 'square', 660, 660, t + 0.06, 0.05, 0.03); },
  collect(A, o, t) { [880, 1320, 1760].forEach((f, i) => A.tone(o, 'sine', f, f, t + i * 0.045, 0.12, 0.09)); },
  coin(A, o, t) { A.tone(o, 'square', 988, 988, t, 0.07, 0.05); A.tone(o, 'square', 1318, 1318, t + 0.07, 0.16, 0.05); },
  click(A, o, t) { A.tone(o, 'sine', 1250, 900, t, 0.035, 0.09); A.tone(o, 'triangle', 2500, 2500, t, 0.015, 0.03); },
  error(A, o, t) { A.tone(o, 'square', 190, 170, t, 0.08, 0.06); A.tone(o, 'square', 150, 140, t + 0.09, 0.1, 0.06); },
  bite(A, o, t) { A.tone(o, 'triangle', 150, 100, t, 0.06, 0.07); A.noise(o, t, 0.04, 0.04, 'bandpass', 700, 1.5); },
  armorOff(A, o, t) { [523, 1310, 2011, 2890].forEach((f, i) => A.tone(o, 'square', f, f * 0.98, t, 0.32 - i * 0.05, 0.022)); A.noise(o, t, 0.08, 0.08, 'highpass', 3000); },
  freeze(A, o, t) { A.tone(o, 'sine', 1900, 300, t, 0.6, 0.09); A.tone(o, 'sine', 2850, 600, t, 0.5, 0.04); A.noise(o, t, 0.6, 0.05, 'highpass', 6000, 0.7, 9000); },
  inject(A, o, t) { A.tone(o, 'sine', 400, 1600, t, 0.3, 0.1); [0, 0.07, 0.14].forEach(d => A.tone(o, 'sine', 900 + d * 4000, 1400 + d * 4000, t + d, 0.05, 0.04)); },
  grab(A, o, t) { A.noise(o, t, 0.2, 0.08, 'lowpass', 900, 1, 3000); A.tone(o, 'square', 150, 320, t, 0.18, 0.05); },
  overheat(A, o, t) { A.noise(o, t, 0.55, 0.1, 'highpass', 3500, 0.7, 7000); A.tone(o, 'sawtooth', 520, 190, t, 0.3, 0.04); },
  sweeper(A, o, t) { A.noise(o, t, 0.75, 0.12, 'lowpass', 500, 2, 1400); A.tone(o, 'sawtooth', 60, 130, t, 0.7, 0.08); A.tone(o, 'square', 880, 880, t, 0.1, 0.03); A.tone(o, 'square', 660, 660, t + 0.12, 0.1, 0.03); },
  // волна: труба из двух голосов
  wave(A, o, t) { INST.brassLead(A, o, t, 57, 0.28, 1.6); INST.brassLead(A, o, t, 64, 0.28, 1.2); INST.brassLead(A, o, t + 0.32, 62, 0.45, 1.6); INST.brassLead(A, o, t + 0.32, 69, 0.45, 1.2); },
  // огромная волна: сирена и удары
  huge(A, o, t) {
    const s = A.ctx.createOscillator(), g = A.ctx.createGain();
    s.type = 'sawtooth'; [0, 0.3, 0.6, 0.9, 1.2].forEach((d, i) => s.frequency.setValueAtTime(i % 2 ? 880 : 560, t + d));
    s.frequency.linearRampToValueAtTime(560, t + 1.4);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045, t + 0.05); g.gain.setValueAtTime(0.045, t + 1.25); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2200;
    s.connect(f); f.connect(g); g.connect(o); s.start(t); s.stop(t + 1.55);
    [0, 0.3, 0.6].forEach(d => { DRUM.kick(A, o, t + d, 1); DRUM.anvil(A, o, t + d, 0.8); });
  },
  // флаг волны пройден — короткий «тадам»
  flag(A, o, t) { [67, 72, 76].forEach((n, i) => INST.pluck(A, o, t + i * 0.08, n, 0.2, 1.4)); },
  rankup(A, o, t) { [60, 64, 67, 72, 76].forEach((n, i) => INST.pluck(A, o, t + i * 0.07, n, 0.25, 1.5)); INST.brightPad(A, o, t + 0.35, 72, 0.5, 1.5); },
  // победа: фанфара
  win(A, o, t) {
    const b = 0.13;
    [[67, 0, 1], [72, 1, 1], [76, 2, 1], [79, 3, 2], [76, 5, 1], [79, 6, 1], [84, 7, 5]].forEach(([n, s, l]) => INST.heroLead(A, o, t + s * b, n, l * b, 1.6));
    [60, 64, 67].forEach(n => INST.warmPad(A, o, t + 7 * b, n, 0.9, 2));
    DRUM.crash(A, o, t + 7 * b, 0.9); DRUM.kick(A, o, t + 7 * b, 1);
  },
  // поражение: мягкое «у-у-у» маримбой и тихий аккорд — без драмы
  lose(A, o, t) {
    [[67, 0], [64, 0.2], [60, 0.4]].forEach(([n, d]) => INST.marimba(A, o, t + d, n, 0.3, 1.4));
    [48, 55, 60].forEach(n => INST.brightPad(A, o, t + 0.4, n, 0.7, 1.1));
  },
};

// подстройка громкости частых эффектов, чтобы выстрелы не тонули в музыке
const SFX_VOL = { shoot: 1.7, shootTwin: 1.8, shootSmall: 1.8, cryo: 1.6, hit: 1.6, coin: 1.8, collect: 1.4, monDie: 1.3, sweeper: 1.6, click: 1.2 };

// ------------------------------------------------------------------ движок
const Sound = {
  ctx: null, A: null, master: null, sfxGain: null, musGain: null, muted: false, active: {}, lastT: {},
  track: null, song: null, huge: false, paused: false,
  init() {
    const unlock = () => {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        this.A = makeAudioKit(this.ctx);
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
        this.master = this.ctx.createGain(); this.master.connect(comp); comp.connect(this.ctx.destination);
        this.sfxGain = this.ctx.createGain(); this.sfxGain.connect(this.master);
        this.musGain = this.ctx.createGain(); this.musGain.connect(this.master);
        this.applyVolumes();
        if (this.track) { const tr = this.track; this.track = null; this.playMusic(tr, true); }
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    };
    window.addEventListener('pointerdown', unlock); window.addEventListener('keydown', unlock);
    Bus.on('adOpen', () => this.setMuted(true)); Bus.on('adClose', () => this.setMuted(document.hidden));
    document.addEventListener('visibilitychange', () => this.setMuted(document.hidden || Sdk.adOpen));
  },
  applyVolumes() {
    if (!this.ctx) return;
    const s = Save.data.settings, now = this.ctx.currentTime;
    this.sfxGain.gain.setTargetAtTime((s.sfx / 100) * 0.9, now, 0.02);
    this.musGain.gain.setTargetAtTime((s.music / 100) * 0.55, now, 0.05);
    this.master.gain.setTargetAtTime(this.muted ? 0 : 1, now, 0.03);
  },
  setMuted(v) { this.muted = v; this.applyVolumes(); },
  play(name) {
    if (!this.ctx || this.muted) return;
    const fx = SFX[name]; if (!fx) return;
    const now = this.ctx.currentTime;
    if (now - (this.lastT[name] || 0) < 0.035) return;        // одинаковые звуки не «слипаются» в треск
    if ((this.active[name] || 0) >= 4) return;
    this.lastT[name] = now; this.active[name] = (this.active[name] || 0) + 1;
    setTimeout(() => { this.active[name]--; }, 250);
    const g = this.ctx.createGain(); g.gain.value = SFX_VOL[name] || 1; g.connect(this.sfxGain);
    try { fx(this.A, g, now + 0.005); } catch (e) { console.warn('sfx', name, e); }
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 4000);
  },
  // ---- музыка
  // У каждой песни своя шина: при смене трека старая плавно гаснет, уже запланированные ноты не обрываются щелчком.
  buildBus(bpm) {
    const c = this.ctx, bus = c.createGain(), dry = c.createGain(), tone = c.createBiquadFilter();
    tone.type = 'lowpass'; tone.frequency.value = this.paused ? 900 : 20000;
    bus.gain.value = 0.0001; bus.gain.setTargetAtTime(1, c.currentTime, 0.4);
    dry.connect(tone); tone.connect(bus); bus.connect(this.musGain);
    const rev = c.createConvolver(); rev.buffer = this.A.ir;
    const revIn = c.createGain(), revOut = c.createGain(); revOut.gain.value = 0.9;
    revIn.connect(rev); rev.connect(revOut); revOut.connect(tone);
    const dl = c.createDelay(1.5), fb = c.createGain(), dlf = c.createBiquadFilter(), dlIn = c.createGain(), dlOut = c.createGain();
    dl.delayTime.value = (60 / bpm) * 0.75; fb.gain.value = 0.32; dlf.type = 'lowpass'; dlf.frequency.value = 2400; dlOut.gain.value = 0.7;
    dlIn.connect(dl); dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(dlOut); dlOut.connect(tone);
    // канал = громкость + посылы в реверб и дилей
    const ch = (vol, rv, dv) => {
      const g = c.createGain(); g.gain.value = vol; g.connect(dry);
      if (rv) { const s = c.createGain(); s.gain.value = rv; g.connect(s); s.connect(revIn); }
      if (dv) { const s = c.createGain(); s.gain.value = dv; g.connect(s); s.connect(dlIn); }
      return g;
    };
    return { bus, tone, ch: { pad: ch(1, 0.55, 0), arp: ch(1, 0.3, 0.35), bass: ch(1, 0.05, 0), lead: ch(1, 0.35, 0.28), drums: ch(1, 0.12, 0) } };
  },
  playMusic(name, force) {
    if (this.track === name && !force && this.song) return;
    this.track = name;
    if (!this.ctx) return;
    this.stopMusic(0.5, true);
    const song = SONGS[name]; if (!song) return;
    const bus = this.buildBus(song.bpm);
    this.song = { def: song, bus, step: 0, next: this.ctx.currentTime + 0.12, d16: 60 / song.bpm / 4 };
    this.song.timer = setInterval(() => this.tick(), 25);
  },
  stopMusic(fade = 0.6, keepTrack) {
    const s = this.song; if (!s) { if (!keepTrack) this.track = null; return; }
    clearInterval(s.timer); this.song = null;
    if (!keepTrack) this.track = null;
    const g = s.bus.bus.gain, now = this.ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.setTargetAtTime(0.0001, now, fade / 4);
    setTimeout(() => { try { s.bus.bus.disconnect(); } catch (e) {} }, (fade + 3) * 1000);
  },
  tick() {
    const s = this.song; if (!s || !this.ctx) return;
    const now = this.ctx.currentTime;
    if (s.next < now - 0.1) s.next = now + 0.05;                 // вкладка спала — не догоняем пропущенное
    while (s.next < now + 0.18) { this.scheduleStep(s, s.next); s.next += s.d16; s.step++; }
  },
  scheduleStep(s, t) {
    const song = s.def, A = this.A, ch = s.bus.ch, d = s.d16;
    const total = song.bars.length, loopLen = total - song.loopBar;
    const bi = Math.floor(s.step / 16), k = s.step % 16;

    // арпеджио

    if (sec.bass) {
      const p = sec.bass, ch8 = p[k];

    if (bar.lead) for (const e of bar.lead) if (e.step === k) INST[I.lead](A, ch.lead, t, e.n, d * e.len * 0.95, 1);

    const kit = song.kits[bar.last && sec.fill ? sec.fill : sec.drums] || {};
    for (const drum in kit) {
      const v = VEL[kit[drum][k]];
      if (v) DRUM[drum](A, ch.drums, t, v);
    }
    if (k === 0 && ((bar.bi === 0 && sec.crashFirst) || (huge && bar.bi % 2 === 0))) DRUM.crash(A, ch.drums, t, 0.8);

  },
  setHuge(v) { this.huge = !!v; },
  // пауза боя: музыка уходит «за стену» — приглушается и тускнеет
  setPaused(v) {

};

// Крупный жирный текст (заголовки, кнопки, цифры) — шрифтом интерфейса FONT_UI, остальное — обычным FONT.

// Телефон: сенсорный экран и маленькая сторона экрана < 900 (или ?mobile в адресе для проверки на компьютере).
// Там игра ужимается в ~2 раза, поэтому мелкий текст (< 22 px) увеличиваем ~на 30%, крупный не трогаем.

const TXT = (size, color = '#ffffff', bold = true, extra = {}) => {

};

const BTN_PALETTE = { 0xe8742a: 0xd9661f, 0x3b8c5a: 0x2f7a4a, 0x3b5b8c: 0x24406e, 0x3a4252: 0x2a3140, 0x3a3f4b: 0x2a3140, 0x5a4a30: 0x6b4a14, 0x8a2a2a: 0x7a2424, 0x7a2a8a: 0x5e2a78 };

// Скруглённая панель: тень, заливка, блик сверху, рамка
function hudPanel(g, x, y, w, h, o = {}) {
  const r = o.r || 14;
  g.fillStyle(0x000000, 0.35); g.fillRoundedRect(x + 2, y + 4, w, h, r);
  g.fillStyle(o.fill || 0x16213a, o.alpha || 0.92); g.fillRoundedRect(x, y, w, h, r);
  if (!o.noShine) { g.fillStyle(0xffffff, 0.06); g.fillRoundedRect(x + 3, y + 3, w - 6, Math.min(h * 0.42, 40), { tl: r - 3, tr: r - 3, bl: 2, br: 2 }); }   // блик сверху

// Кнопка HUD со скруглённой рамкой. setFrame(цвет|null) — подсветка (null = обычная).
function hudButton(scene, x, y, w, h, label, color, cb, size = 22, icon = null) {
  const c = scene.add.container(x, y), g = scene.add.graphics();
  const hit = scene.add.rectangle(0, 0, w, h, 0x000000, 0.001);
  const tx = scene.add.text(0, icon && label ? h * 0.26 : 0, label, TXT(size, '#ffffff', true, { align: 'center', fontFamily: FONT_UI, fontStyle: 'normal' })).setOrigin(0.5);
  c.add([g, hit, tx]);

  c.tx = tx; c.bg = hit; c.frame = undefined; c.fill = color;

    if (c.frame === col) return c;
    c.frame = col; g.clear();
    if (col) { g.lineStyle(8, col, 0.3); g.strokeRoundedRect(-w / 2 - 3, -h / 2 - 3, w + 6, h + 6, 15); }
    hudPanel(g, -w / 2, -h / 2, w, h, { fill: c.fill, alpha: 1, stroke: col || 0x5a7bb0, r: 12 });
    return c;

  c.setFill = col => { if (c.fill !== col) { c.fill = col; const f = c.frame; c.frame = undefined; c.setFrame(f); } return c; };
  c.setFrame(null); c.setSize(w, h);

// Кнопка меню в стиле HUD: скруглённая панель, блик, подпись и необязательная пометка под ней.
// opts: { enabled, note, icon } — note выводится мелко (например «Откроется после миссии 4»)
function uiButton(scene, x, y, w, h, label, color, cb, size = 28, opts = {}) {
  const enabled = opts.enabled !== false;
  const c = hudButton(scene, x, y, w, h, '', enabled ? color : 0x262c38, () => {
    if (!c.enabled) { Sound.play('error'); return; }

  const dy = opts.note ? -h * 0.12 : 0;

  if (opts.note) c.add(scene.add.text(0, h * 0.26, opts.note, TXT(Math.round(size * 0.55), enabled ? '#dfe7f2' : '#8a93a6', false)).setOrigin(0.5));

    c.tx.setX(h * 0.3);   // подпись чуть правее, чтобы не наезжала на иконку
    if (!enabled) ic.setTint(0x6b7280).setAlpha(0.7);

  if (!enabled && !(opts.img && scene.textures.exists(opts.img))) { const lk = scene.add.graphics(); drawLockIcon(lk, -w / 2 + 34, 0, 0.8); c.add(lk); }
  if (!enabled && opts.img && scene.textures.exists(opts.img)) { const lk = scene.add.graphics(); drawLockIcon(lk, -w / 2 + h * 0.55 + 16, 14, 0.6); c.add(lk); }
  // подпись и пометка не вылезают за кнопку (длинные английские слова): ужимаем по ширине свободного места
  const hasImg = opts.img && scene.textures.exists(opts.img), L = hasImg ? -w / 2 + h * 1.0 : -w / 2 + (enabled ? 14 : 54);
  let Rr = w / 2 - 14;

  c.suffix = (key, k = 0.8) => {
    const ic = scene.add.image(0, opts.note ? -h * 0.12 : 0, key).setScale(k); ic.x = w / 2 - 14 - ic.displayWidth / 2; c.add(ic);
    if (!c.enabled) ic.setTint(0x6b7280).setAlpha(0.7);

  };
  // по центру кнопки, если помещается, не задевая значок слева/справа; иначе — по центру свободного места, с ужатием
  const fitIn = t => { t.setScale(1); const half = Math.min(-L, Rr); if (half > 0 && t.width <= 2 * half) { t.setX(0); return; } t.setX((L + Rr) / 2); if (t.width > Rr - L) t.setScale((Rr - L) / t.width); };

  fitIn(c.tx);
  c.list.forEach(o => { if (o !== c.tx && o.type === 'Text') fitIn(o); });
  c.setEnabled = v => { c.enabled = v; c.tx.setColor(v ? '#ffffff' : '#7d8699'); c.setFill(v ? color : 0x262c38); return c; };

}

// Медальон миссии в виде шестерни: state = 'locked' | 'open' | 'current' | 'done'

  const pts = [];

    const a0 = (i / (teeth * 2)) * Math.PI * 2, rr = i % 2 ? r * 0.86 : r;

  g.fillStyle(0xffffff, 0.12); g.fillEllipse(x, y - r * 0.26, r * 1.0, r * 0.52);

function mechCard(scene, x, y, id, size = 112, opts = {}) {
  const d = MECHS[id], c = scene.add.container(x, y), s = size, h2 = s / 2, rad = Math.round(s * 0.13);
  const g = scene.add.graphics();
  const bg = scene.add.rectangle(0, 0, s, s, 0x000000, 0.001);   // зона нажатия; рамку рисует setFrame
  const ic = fitTex(scene.add.image(0, -s * 0.1, d.tex), s * 0.84, s * 0.6, d.texBB);
  const pill = scene.add.graphics();
  pill.fillStyle(0x0b1120, 0.92); pill.fillRoundedRect(-h2 + 7, h2 - s * 0.27, s - 14, s * 0.21, s * 0.1);
  const orb = scene.add.image(-s * 0.2, h2 - s * 0.165, 'orb').setScale(s * 0.0034);
  const cost = scene.add.text(s * 0.07, h2 - s * 0.165, String(d.cost), TXT(Math.round(s * 0.19), '#ffe27a')).setOrigin(0.5);
  c.add([g, bg, ic, pill, orb, cost]);
  const r = Save.rank(id);
  for (let i = 0; i < r - 1; i++) c.add(scene.add.image(-h2 + 14 + i * 16, -h2 + 14, 'star').setScale(0.25));
  c.bg = bg; c.ic = ic; c.cost = cost; c.orb = orb; c.pill = pill; c.setSize(s, s);
  c.setFrame = col => {
    if (c.frame === col) return c;
    c.frame = col; g.clear();
    g.fillStyle(0x000000, 0.4); g.fillRoundedRect(-h2 + 2, -h2 + 4, s, s, rad);
    g.fillStyle(0x18243c); g.fillRoundedRect(-h2, -h2, s, s, rad);
    g.fillStyle(0x2a3d62); g.fillRoundedRect(-h2 + 4, -h2 + 4, s - 8, s * 0.64, { tl: rad - 3, tr: rad - 3, bl: 6, br: 6 });
    g.fillStyle(0xffffff, 0.08); g.fillRoundedRect(-h2 + 4, -h2 + 4, s - 8, s * 0.22, { tl: rad - 3, tr: rad - 3, bl: 1, br: 1 });
    if (col === 0xffd23d) { g.lineStyle(8, col, 0.3); g.strokeRoundedRect(-h2 - 3, -h2 - 3, s + 6, s + 6, rad + 3); }
    g.lineStyle(3, col); g.strokeRoundedRect(-h2, -h2, s, s, rad);
    return c;
  };
  c.setFrame(opts.stroke || 0x4f79b8);
  return c;
}

class MapScene extends Phaser.Scene {
  constructor() { super('Map'); }
  create() {
    Sdk.gameplay(false);
    screenBg(this, 0.3, 'bg_map');
    backButton(this, 'Menu');
    currencyBar(this, W - 210, 50);
    const d = Save.data, total = (CAMPAIGN_N + SECRET_IDX.filter(i => secretOpen(d, i)).length) * 3, got = MISSIONS.reduce((a, _, i) => a + (d.stars[i] || 0), 0);
    this.add.text(W / 2, 56, t('campaign'), TXT(52, '#ffe27a', true, { stroke: '#0b1020', strokeThickness: 10 })).setOrigin(0.5);
    // общий счёт звёзд

    this.add.image(W - 522, 56, 'star').setScale(0.55);
    this.add.text(W - 494, 57, `${got}/${total}`, TXT(26, '#ffe27a', true, { stroke: '#0b1020', strokeThickness: 4 })).setOrigin(0, 0.5);

    // «змейка» по 5 миссий в ряд: ряды 1–2 — Поверхность (светлая часть фона), 3–4 — Литейный цех
    const PER = 5, R = 52;
    const pos = i => { const row = Math.floor(i / PER), c = i % PER, col = row % 2 ? PER - 1 - c : c; return { x: 350 + col * 225, y: 222 + row * 172 }; };
    // таблички зон в левом поле: название и звёзды зоны
    const zones = [];
    MISSIONS.forEach((m, i) => { if (m.secret) return; const z = zones[zones.length - 1]; if (!z || z.zone !== m.zone) zones.push({ zone: m.zone, from: i, to: i + 1 }); else z.to = i + 1; });
    for (const zn of zones) {
      const z = ZONE_STYLE[zn.zone] || ZONE_STYLE.surface, g = this.add.graphics(), y = pos(zn.from).y - 86;
      hudPanel(g, 18, y - 40, 196, 80, { fill: z.panel, alpha: 0.92, stroke: z.accent, r: 14 });
      this.add.text(116, y - 14, t('zone_' + zn.zone), TXT(22, z.text, true, { stroke: '#0b1020', strokeThickness: 4, align: 'center', wordWrap: { width: 180 } })).setOrigin(0.5);
      let s = 0; for (let i = zn.from; i < zn.to; i++) s += d.stars[i] || 0;
      this.add.image(94, y + 18, 'star').setScale(0.36);
      this.add.text(110, y + 19, `${s}/${(zn.to - zn.from) * 3}`, TXT(19, '#ffffff')).setOrigin(0, 0.5);
    }

    // дорога между миссиями: пройденная — золотая, остальная — тёмная пунктирная
    const road = this.add.graphics();
    const seg = (a, b, done) => {
      road.lineStyle(18, 0x0b1020, 0.55); road.lineBetween(a.x, a.y, b.x, b.y);
      if (done) { road.lineStyle(10, 0xffc83d, 0.95); road.lineBetween(a.x, a.y, b.x, b.y); return; }
      const len = Math.hypot(b.x - a.x, b.y - a.y), n = Math.floor(len / 26);
      road.lineStyle(8, 0x5a6478, 0.9);
      for (let k = 0; k < n; k += 2) road.lineBetween(a.x + (b.x - a.x) * k / n, a.y + (b.y - a.y) * k / n, a.x + (b.x - a.x) * (k + 1) / n, a.y + (b.y - a.y) * (k + 1) / n);
    };
    for (let i = 0; i < CAMPAIGN_N - 1; i++) seg(pos(i), pos(i + 1), !!d.cleared[i]);
    // тайники: появляются после своей миссии, снаружи змейки (у края карты)

      if (!secretOpen(d, i)) continue;
      const par = pos(MISSIONS[i].after - 1), p = { x: par.x + (par.x < W / 2 ? -205 : 205), y: par.y };
      seg(par, p, !!d.cleared[i]);

      if (!done) {

        this.tweens.add({ targets: glow, scale: 1.2, alpha: 0.06, duration: 1000, yoyo: true, repeat: -1 });
      }
      gearBadge(g, 0, 0, R, done ? 0xe0a93a : 0xffd23d, 0x3a1a5a, 10);
      node.add(g);
      node.add(this.add.text(0, -2, done ? '★' : '???', TXT(done ? 40 : 30, '#ffe27a', true, { stroke: '#0b1020', strokeThickness: 6 })).setOrigin(0.5));
      const nm = this.add.text(p.x, p.y + R + 20, missionName(i), TXT(17, '#e0c2ff', true, { stroke: '#0b1020', strokeThickness: 4 })).setOrigin(0.5);
      const pl = this.add.graphics(); pl.fillStyle(0x0b1020, 0.7); pl.fillRoundedRect(p.x - nm.width / 2 - 10, p.y + R + 8, nm.width + 20, 25, 12);
      nm.setDepth(1); pl.setDepth(0.5);
      for (let k = 0; k < 3; k++) { const s = this.add.image(p.x - 26 + k * 26, p.y + R + 46, 'star').setScale(0.36); if (k >= st) s.setTint(0x3a404c).setAlpha(0.8); }
      const hit = this.add.circle(p.x, p.y, R, 0x000000, 0.001).setInteractive({ useHandCursor: true });
      hit.on('pointerover', () => this.tweens.add({ targets: node, scale: 1.08, duration: 120 }));
      hit.on('pointerout', () => this.tweens.add({ targets: node, scale: 1, duration: 120 }));
      hit.on('pointerdown', () => { Sound.play('click'); startMission(this, i); });
    }
    MISSIONS.forEach((m, i) => {
      if (m.secret) return;
      const p = pos(i), open = i < d.reached, done = !!d.cleared[i], cur = open && !done && i === d.reached - 1, st = d.stars[i] || 0;
      const z = ZONE_STYLE[m.zone] || ZONE_STYLE.surface;
      const node = this.add.container(p.x, p.y);
      const g = this.add.graphics();
      if (cur) {   // пульсирующее свечение текущей миссии
        const glow = this.add.circle(p.x, p.y, R + 14, 0xffd23d, 0.28);
        this.tweens.add({ targets: glow, scale: 1.18, alpha: 0.05, duration: 900, yoyo: true, repeat: -1 });
      }
      gearBadge(g, 0, 0, R, !open ? 0x3a404c : done ? 0xe0a93a : cur ? 0xffd23d : 0x9aa4b5, open ? z.face : 0x1b2030, 10);
      node.add(g);
      node.add(this.add.text(0, -2, String(i + 1), TXT(40, open ? '#ffffff' : '#5d6678', true, { stroke: '#0b1020', strokeThickness: 6 })).setOrigin(0.5));
      if (!open) { const lk = this.add.graphics(); drawLockIcon(lk, 28, 26, 0.7); node.add(lk); }
      // новый мех миссии — портрет в кружке
      if (m.unlock && m.unlock.length && open) {
        const bub = this.add.graphics(); bub.fillStyle(0x0b1020, 0.85); bub.fillCircle(42, -40, 24); bub.lineStyle(3, z.accent); bub.strokeCircle(42, -40, 24);
        node.add(bub);

      }
      // табличка с названием и звёзды
      const nm = this.add.text(p.x, p.y + R + 20, missionName(i), TXT(17, open ? '#ffffff' : '#8a93a6', true, { stroke: '#0b1020', strokeThickness: 4 })).setOrigin(0.5);
      const pl = this.add.graphics(); pl.fillStyle(0x0b1020, 0.7); pl.fillRoundedRect(p.x - nm.width / 2 - 10, p.y + R + 8, nm.width + 20, 25, 12);
      nm.setDepth(1); pl.setDepth(0.5);
      if (open) for (let k = 0; k < 3; k++) {
        const s = this.add.image(p.x - 26 + k * 26, p.y + R + 46, 'star').setScale(0.36);
        if (k >= st) s.setTint(0x3a404c).setAlpha(0.8);
      }
      if (open) {
        const hit = this.add.circle(p.x, p.y, R, 0x000000, 0.001).setInteractive({ useHandCursor: true });
        hit.on('pointerover', () => this.tweens.add({ targets: node, scale: 1.08, duration: 120 }));
        hit.on('pointerout', () => this.tweens.add({ targets: node, scale: 1, duration: 120 }));
        hit.on('pointerdown', () => { Sound.play('click'); startMission(this, i); });
      }
    });
  }
}

function rankLine(d, r) {

  if (r >= RANKS.max) return `${t('rkv_' + d.rankStat, { p: rankPct(d, RANKS.max - 1) })} + ${t('rankPerk')}`;
  return t('rkv_' + d.rankStat, { p: rankPct(d, r) });
}

const rankOpen = r => !RANKS.after || !RANKS.after[r] || !!Save.data.cleared[RANKS.after[r] - 1];

// Текст сжимается, пока не влезет в ширину (названия не вылезают за карточку)

function rankGears(g, x, y, r, k = 1) {

function portraitFrame(g, x, y, r, accent, fill = 0x0b1120) {
  const pts = []; for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; pts.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r }); }

  g.fillStyle(accent, 0.18); g.fillPoints(pts.map(p => ({ x: x + (p.x - x) * 0.82, y: y + (p.y - y) * 0.82 })), true);

// строка про открытый тайник в окне победы (первое прохождение M11 / M15)
function secretText(i, first) { return first && MISSIONS.some(m => m.secret && m.after === i + 1) ? t('secretOpened') : ''; }
// строка про чертёж в окне победы (первое прохождение миссии, за которую дают чертёж)
function bpText(i, first) {
  if (!FACTORY.enabled || !first) return '';
  const e = Object.entries(FACTORY.machines).find(([, m]) => m.blueprint === i + 1);
  return e ? t('fBpGot', { m: N(e[1].name) }) : '';

const Fac = {
  HOUR: 3600 * 1000,
  data() {
    const d = Save.data;
    if (!d.factory) {
      const now = Date.now();
      d.factory = { slots: FACTORY.slots.start, list: [{ type: 'press', lvl: 1, p: 0, t: now }, { type: 'sorter', lvl: 1, p: 0, t: now }], boostDay: '', boostUntil: 0 };
    }
    const f = d.factory;   // старые сохранения: ускорение раз в сутки → перезарядка от прошлого включения
    if (f.boostNext == null) f.boostNext = f.boostUntil ? f.boostUntil + (FACTORY.boost.every - FACTORY.boost.hours) * this.HOUR : 0;
    return f;
  },
  unlocked(type) { const m = FACTORY.machines[type]; return !m.blueprint || !!Save.data.cleared[m.blueprint - 1]; },
  today() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; },
  // продвигаем прогресс станка до «сейчас» с учётом ускорения за рекламу
  tick(mc, now = Date.now()) {
    const f = this.data(), fill = FACTORY.fillH * this.HOUR;
    const t0 = Math.min(mc.t || now, now), boosted = Math.max(0, Math.min(now, f.boostUntil) - Math.max(t0, f.boostUntil - FACTORY.boost.hours * this.HOUR));
    mc.p = Math.min(1, (mc.p || 0) + (now - t0 + boosted * (FACTORY.boost.mul - 1)) / fill); mc.t = now;
  },
  amounts(mc) {   // сколько сейчас на складе станка
    const m = FACTORY.machines[mc.type], k = FACTORY.lvlMul[mc.lvl] * mc.p, out = {};
    for (const r in m.res) out[r] = Math.floor(m.res[r] * k);
    return out;
  },
  cap(mc) { const m = FACTORY.machines[mc.type], out = {}; for (const r in m.res) out[r] = Math.round(m.res[r] * FACTORY.lvlMul[mc.lvl]); return out; },
  collect(mc) {
    this.tick(mc);
    const a = this.amounts(mc), d = Save.data; let any = 0;
    for (const r in a) { d[r] += a[r]; any += a[r]; }
    if (any) mc.p = 0;
    return any ? a : null;
  },
  // есть что собрать (для значка на кнопке меню)
  ready() {
    if (!FACTORY.enabled) return false;
    const f = this.data(); let r = false;
    for (const mc of f.list) if (mc) { this.tick(mc); if (mc.p >= 0.5) r = true; }
    return r;
  },
};
// длинные промежутки — «4 ч 47 мин», чтобы не путать с минутами:секундами
const fmtHM = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? (LANG === 'ru' ? `${h} ч ${m} мин` : `${h}h ${m}m`) : fmtT(ms); };
const fmtT = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}:${String(m).padStart(2, '0')}` : `${m}:${String(s % 60).padStart(2, '0')}`; };

// Текстуры станков: 3 кадра «удара» (поршень вверху, на полпути, внизу с искрами). Рисуются один раз.
function machineTextures(scene) {
  const OUT = 0x14171f;
  for (const [type, m] of Object.entries(FACTORY.machines)) for (let f = 0; f < 3; f++) {
    const key = `mach_${type}_${f}`; if (scene.textures.exists(key)) continue;
    const g = scene.make.graphics({ add: false }), c = m.color;
    // основание с сигнальными полосами
    g.fillStyle(0x2a2f3a, 1); g.fillRoundedRect(14, 168, 172, 26, 8);
    g.fillStyle(0xffc629, 1); for (let x = 22; x < 176; x += 18) g.fillPoints([{ x, y: 192 }, { x: x + 9, y: 170 }, { x: x + 16, y: 170 }, { x: x + 7, y: 192 }], true);
    g.lineStyle(4, OUT, 1); g.strokeRoundedRect(14, 168, 172, 26, 8);
    // станина: две колонны и верхняя балка
    for (const x of [30, 150]) { g.fillStyle(0x6b7488, 1); g.fillRoundedRect(x, 34, 22, 138, 6); g.fillStyle(0x8a93a6, 1); g.fillRect(x + 4, 38, 7, 130); g.lineStyle(4, OUT, 1); g.strokeRoundedRect(x, 34, 22, 138, 6); }
    g.fillStyle(c, 1); g.fillRoundedRect(22, 16, 158, 32, 10); g.lineStyle(4, OUT, 1); g.strokeRoundedRect(22, 16, 158, 32, 10);
    g.fillStyle(0xffffff, 0.35); g.fillRoundedRect(30, 20, 110, 8, 4);
    // наковальня/лоток с продукцией
    g.fillStyle(0x3a4254, 1); g.fillRoundedRect(56, 140, 90, 30, 6); g.lineStyle(4, OUT, 1); g.strokeRoundedRect(56, 140, 90, 30, 6);
    if (type === 'press') { g.fillStyle(0xffc83d, 1); g.fillEllipse(101, 136, 44, 14); g.lineStyle(3, OUT, 1); g.strokeEllipse(101, 136, 44, 14); g.fillStyle(0xfff1a8, 1); g.fillEllipse(95, 134, 16, 5); }
    else if (type === 'sorter') { gearBadge(g, 101, 128, 14, 0x9fb4cf, 0x4a5a74, 8); }
    else { g.fillStyle(0xff7a3b, 1); g.fillEllipse(101, 136, 50, 16); g.fillStyle(0xffe45c, 1); g.fillEllipse(101, 134, 26, 7); g.lineStyle(3, OUT, 1); g.strokeEllipse(101, 136, 50, 16); }
    // поршень: шток и боёк — вверху / на полпути / внизу
    const hy = [62, 92, 116][f];
    g.fillStyle(0xb8c2d6, 1); g.fillRect(93, 46, 16, hy - 46); g.lineStyle(3, OUT, 1); g.strokeRect(93, 46, 16, hy - 46);
    g.fillStyle(c, 1); g.fillRoundedRect(58, hy, 86, 22, 6); g.lineStyle(4, OUT, 1); g.strokeRoundedRect(58, hy, 86, 22, 6);
    g.fillStyle(0x14171f, 0.35); g.fillRect(62, hy + 15, 78, 4);
    if (f === 2) {   // удар: искры и линии
      g.lineStyle(4, 0xfff1a8, 1);
      for (const [dx, dy] of [[-58, -6], [-52, 10], [58, -6], [52, 10], [-40, 20], [40, 20]]) g.lineBetween(101 + dx * 0.55, 142 + dy * 0.3, 101 + dx, 142 + dy);
    }
    g.generateTexture(key, 200, 200); g.destroy();
  }
  for (const type of Object.keys(FACTORY.machines)) {
    const key = 'mach_' + type;
    if (!scene.anims.exists(key)) scene.anims.create({ key, frames: [0, 0, 0, 0, 1, 2, 2, 1].map(i => ({ key: `mach_${type}_${i}` })), frameRate: 8, repeat: -1 });
  }
}

      if (full) { if (c.sp.anims.isPlaying) { c.sp.anims.stop(); c.sp.setTexture(`mach_${c.mc.type}_0`); } }
      else { if (!c.sp.anims.isPlaying) c.sp.play('mach_' + c.mc.type); c.sp.anims.timeScale = rate; }

    if (this.boostBtn) {

    for (const r in got) if (got[r]) for (let k = 0; k < Math.min(6, 2 + Math.floor(got[r] / 8)); k++) {

  collectAll() {
    let any = false;
    for (const c of this.cards) if (this.collect(c, true)) any = true;
    Sound.play(any ? 'coin' : 'error');
  }
}
